# Workspace do Warden (ARCHITECTURE §2 e §3).
# Dependências e lints são declarados uma vez aqui; as crates usam `dep.workspace = true`
# e `[lints] workspace = true`. `[workspace.dependencies]` é registro acréscimo-apenas
# (ROADMAP §1): uma linha por dependência.

[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
repository = "https://github.com/Kriticales/Warden"

[workspace.dependencies]
# Crates internas, na ordem da ARCHITECTURE §3.
warden-core = { path = "crates/warden-core" }
warden-packwiz = { path = "crates/warden-packwiz" }
warden-packwiz-cli = { path = "crates/warden-packwiz-cli" }
warden-http = { path = "crates/warden-http" }
warden-modrinth = { path = "crates/warden-modrinth" }
warden-curseforge = { path = "crates/warden-curseforge" }
warden-catalog = { path = "crates/warden-catalog" }
warden-jarmeta = { path = "crates/warden-jarmeta" }
warden-project = { path = "crates/warden-project" }
warden-configs = { path = "crates/warden-configs" }
warden-java = { path = "crates/warden-java" }
warden-launcher = { path = "crates/warden-launcher" }
warden-instance = { path = "crates/warden-instance" }
warden-diagnostics = { path = "crates/warden-diagnostics" }
warden-ai = { path = "crates/warden-ai" }
warden-mixin = { path = "crates/warden-mixin" }
warden-bisect = { path = "crates/warden-bisect" }
warden-server = { path = "crates/warden-server" }
warden-perf = { path = "crates/warden-perf" }
warden-discovery = { path = "crates/warden-discovery" }
warden-import = { path = "crates/warden-import" }
warden-scripts = { path = "crates/warden-scripts" }
warden-versioning = { path = "crates/warden-versioning" }
warden-export = { path = "crates/warden-export" }
warden-secrets = { path = "crates/warden-secrets" }

# Externas, em ordem alfabética. Versões exatas ficam no Cargo.lock; aqui, o mínimo compatível.
# `specta`, `specta-typescript` e `tauri-specta` são RC e ficam fixados com `=` (ADR-0018).
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
hex = "0.4.3"
httpdate = "1.0.3"
insta = { version = "1.49.0", features = ["json"] }
jsonc-parser = "0.34.0"
junction = "2.1.0"
keyring-core = "1.0.0"
md-5 = "0.10.6"
proptest = "1.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = "1.1.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sha2 = "0.10.9"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tar = { version = "0.4.46", default-features = false }
tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std", "tracing-log"] }
ulid = "3.0.0"
unicode-normalization = "0.1.25"
ureq = "3.4.2"
url = "2.5.8"
which = "8.0.6"
windows = "0.62.2"
windows-native-keyring-store = "1.1.0"
wiremock = "0.6.5"
zbus-secret-service-keyring-store = "1.0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
large_futures = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Dependências sem informação de depuração em build de debug: a pasta `target` fica bem
# menor e o link mais rápido (QUALITY §13.4); o código do Warden mantém a depuração completa.
[profile.dev.package."*"]
debug = false
