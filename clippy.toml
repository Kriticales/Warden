# QUALITY §2.1: os lints de pânico valem para o código do app; nos testes, `unwrap`,
# `expect` e `panic!` são a forma idiomática de falhar.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Nomes próprios do domínio que o `doc_markdown` confundiria com identificadores de código.
doc-valid-idents = [
  "CurseForge", "NeoForge", "LegacyFabric", "KubeJS", "CraftTweaker", "ZenScript", "MultiMC",
  "WebView2", "WebKitGTK", "PowerShell", "GitHub", "TypeScript", "JavaScript", "TanStack",
  "..",
]
