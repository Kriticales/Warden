# cargo-nextest (QUALITY §4.1).

[profile.default]
# Teste que passa de 60 s aparece como lento; depois de 3 períodos é encerrado.
slow-timeout = { period = "60s", terminate-after = 3 }
# Sem novas tentativas: teste instável é bug (QUALITY §4.1, determinismo).
retries = 0

[profile.ci]
# Na CI, roda tudo e mostra todas as falhas de uma vez.
fail-fast = false
failure-output = "immediate-final"
