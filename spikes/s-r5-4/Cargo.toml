[package]
name = "sr54-laco-gemini"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike S-R5-4: laço de ferramentas do Gemini (descartável)"

# Fora de qualquer workspace do repositório: o spike compila sozinho.
[workspace]

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
