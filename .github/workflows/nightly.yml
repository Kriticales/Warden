# Execução noturna do Warden (F0-02; ADR-0022; QUALITY §4.1 e §12). Roda na `main` toda noite
# e manualmente (Actions → Noturno → Run workflow).
#
#   - rede: testes contra as APIs reais (`cargo xtask test-network`), com a chave da CurseForge
#     dos segredos do repositório. É o único workflow que recebe segredos;
#   - windows: check, cofre real e instalador do `windows.yml` (decisão D9);
#   - conformidade no Windows: testes `conformance_*` com o packwiz-installer real e o Java 21;
#   - E2E no Windows, assim que o harness da F0-06 existir;
#   - memória da JVM no Windows: o leitor do `hsperfdata` contra o `jstat` com os JREs 8, 17, 21
#     e 25 (L-11).

name: Noturno

on:
  schedule:
    # 06:00 UTC (03:00 em Brasília), fora do horário de trabalho.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Uma fila por branch: com uma fila só, cada execução pedida para uma branch cancelava a que
# estava esperando para outra (o GitHub guarda só uma execução pendente por grupo).
concurrency:
  group: noturno-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rede:
    name: Linux · testes de rede
    uses: ./.github/workflows/comum.yml
    with:
      runner: ubuntu-24.04
      cache-key: linux-rede
      timeout-minutes: 60
      env-file: true
      # `rede_conformidade_com_mod_real_do_modrinth` roda o packwiz-installer real com o JRE
      # fixado (`cargo xtask installer`); sem eles, `WARDEN_REQUIRE_EXTERNALS=1` faz o teste falhar.
      installer: true
      run: cargo xtask test-network
    secrets:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  conformidade-windows:
    name: Windows · conformidade
    uses: ./.github/workflows/comum.yml
    with:
      runner: windows-latest
      cache-key: windows-conformidade
      timeout-minutes: 90
      java: true
      installer: true
      # Arquivos `tests/conformance_*.rs` (QUALITY §4.1); enquanto não existirem, só avisa.
      run: cargo nextest run --workspace --locked --no-tests=warn -E 'binary(/^conformance_/)'

  memoria-jvm-windows:
    name: Windows · memória da JVM (Java 8, 17, 21 e 25)
    uses: ./.github/workflows/comum.yml
    with:
      runner: windows-latest
      cache-key: windows-memoria-jvm
      timeout-minutes: 60
      # O JDK 21 do `setup-java` traz o `jstat` (só para comparar; o Warden não usa JDK).
      java: true
      # L-11 (CA-T13-10): os JREs Temurin 8, 17, 21 e 25 baixados da API do Adoptium (como no
      # spike S-R5-2); `tests/hsperf_jvm_real.rs` compara a leitura do Warden com o `jstat` em
      # cada um, com o programa parado, e confere as flags que desligam a leitura.
      run: |
        dir="$RUNNER_TEMP/jres"
        mkdir -p "$dir"
        javas=""
        for major in 8 17 21 25; do
          curl -fsSL --retry 4 -o "$dir/jre-$major.zip" \
            "https://api.adoptium.net/v3/binary/latest/$major/ga/windows/x64/jre/hotspot/normal/eclipse"
          unzip -q "$dir/jre-$major.zip" -d "$dir/$major"
          java="$(ls -d "$dir/$major"/*/bin/java.exe | head -n 1)"
          javas="${javas:+$javas;}$(cygpath -w "$java")"
        done
        export WARDEN_HSPERF_JAVAS="$javas"
        export WARDEN_HSPERF_JSTAT="$(cygpath -w "$JAVA_HOME/bin/jstat.exe")"
        cargo nextest run --locked -p warden-perf --test hsperf_jvm_real --no-capture

  detectar-e2e:
    name: Windows · E2E existe?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.detectar.outputs.e2e }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar o harness de E2E
        id: detectar
        run: |
          if [ -f apps/desktop/wdio.conf.ts ] && jq -e '.scripts.e2e' apps/desktop/package.json > /dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E Windows pulado: ainda não há apps/desktop/wdio.conf.ts com o script e2e (F0-06)."
          fi

  e2e-windows:
    name: Windows · E2E
    needs: detectar-e2e
    if: needs.detectar-e2e.outputs.e2e == 'true'
    uses: ./.github/workflows/comum.yml
    with:
      runner: windows-latest
      cache-key: windows-e2e
      timeout-minutes: 90
      # "Testar como o jogador recebe" (L-07) roda o packwiz-installer real dos jars fixados.
      installer: true
      # `e2e-driver` baixa o msedgedriver da mesma versão do WebView2 da máquina (QUALITY §13.5).
      # A tela do runner é de 1024×768 e o Windows às vezes limita a janela a ela, ignorando o
      # `setWindowSize(1366, 860)` dos testes; por isso a resolução sobe para 1920×1080 antes.
      run: |
        powershell -NoProfile -Command '$ErrorActionPreference = "Stop"; Set-DisplayResolution -Width 1920 -Height 1080 -Force'
        cargo xtask e2e-driver
        (cd apps/desktop && cargo tauri build --ci --debug --no-bundle)
        pnpm -C apps/desktop e2e
