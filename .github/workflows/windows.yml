# Windows (reutilizável): o mesmo `cargo xtask check` do Linux, os testes com o cofre real do
# Windows e o instalador NSIS como artefato `warden-windows-<sha>` (F0-02; QUALITY §12 e §13.6),
# com os avisos de terceiros de "Sobre o Warden" gerados e conferidos pelo `cargo xtask check`
# (etapa `notices`) antes do build. Depois do build, `cargo xtask verify-installer` instala,
# abre e desinstala o instalador e falha se sobrar algo fora dos dados do usuário (A-02).
#
# Chamado pelo `ci.yml` (na `main`, em PRs com o rótulo `windows`, em push com `[ci windows]`
# na mensagem do commit e manualmente), pelo `nightly.yml` (toda noite; decisão D9) e pelo
# `pre-versao.yml` (fim de marco, com o `ref` do commit escolhido; INFRA-02).
#
# Testes com o cofre real: marcados `#[ignore = "cofre-real"]` e com `cofre_real` no nome, que
# é o filtro usado aqui (o nextest não filtra pelo motivo do `ignore`). Só rodam nesta máquina
# descartável, nunca no computador do dono. Sem nenhum teste assim, o passo falha, para o
# filtro não ficar vazio sem ninguém perceber.

name: Windows

on:
  workflow_call:
    inputs:
      ref:
        description: Commit a compilar (vazio, o do evento).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  windows:
    name: check, cofre real e instalador
    uses: ./.github/workflows/comum.yml
    with:
      runner: windows-latest
      cache-key: windows
      timeout-minutes: 150
      installer: true
      ref: ${{ inputs.ref }}
      run: |
        cargo xtask check
        cargo nextest run --workspace --locked --run-ignored only --no-tests=fail -E 'test(/cofre_real/)'
        cd apps/desktop
        cargo tauri build --ci --bundles nsis
        cargo xtask verify-installer
      artifact-name: warden-windows-${{ inputs.ref || github.sha }}
      artifact-path: target/release/bundle/nsis/*.exe
