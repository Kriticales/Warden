# Configuração do gitleaks (F0-02): roda na CI em todo push e PR, sobre o histórico inteiro.
#
# Parte das regras padrão do gitleaks e acrescenta a chave da API da CurseForge, que nenhuma
# regra padrão reconhece: tem o formato de um hash bcrypt, `$2a$10$` seguido de 53 caracteres
# do alfabeto do bcrypt (60 no total; conferido na chave real, sem exibi-la).
#
# Testar localmente (PowerShell, com o gitleaks baixado para uma pasta temporária):
#   gitleaks git --config .gitleaks.toml --redact --verbose .

title = "Warden"

[extend]
useDefault = true

[[rules]]
id = "curseforge-api-key"
description = "Chave da API da CurseForge (formato bcrypt `$2a$10$...`)"
regex = '''\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}'''
keywords = ["$2a$", "$2b$", "$2y$"]

# Falsos positivos conhecidos. Cada entrada diz o porquê; a lista só cresce com motivo.
[[allowlists]]
description = "Chave fictícia do teste do xtask: é o base64 de \"ABCDEFGHIJKLMNOPQRSTUVWX\" (xtask/src/packwiz.rs)."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^QUJDREVGR0hJSktMTU5PUFFSU1RVVldY$''']

[[allowlists]]
description = "Tokens inventados de propósito para testar a redação de segredos da D-02 (CurseForge, ghp_, github_pat_, AIza, JWT). Só esta pasta; no resto do repositório as mesmas formas continuam barradas."
paths = ['''^crates[/\\]warden-diagnostics[/\\]tests[/\\]fixtures[/\\]redacao[/\\]''']

[[allowlists]]
description = "JWT fictício usado no teste de redação da D-02 antes de ser movido para a fixture; só a regra jwt neste arquivo histórico."
targetRules = ["jwt"]
paths = ['''^crates[/\\]warden-diagnostics[/\\]src[/\\]redact\.rs$''']

[[allowlists]]
description = "Tokens inventados para testar a publicação da V-03 (varredura de segredos que bloqueia publicar, token que nunca vaza, GitHub simulado dos testes e do E2E). Só estes arquivos e só as regras github-pat e jwt."
targetRules = ["github-pat", "jwt"]
paths = [
  '''^crates[/\\]warden-versioning[/\\]tests[/\\]publicacao[/\\]''',
  '''^crates[/\\]warden-versioning[/\\]src[/\\]publish[/\\]secrets\.rs$''',
  '''^apps[/\\]desktop[/\\]e2e[/\\]mock-server[/\\]github\.ts$''',
]

[[allowlists]]
description = "Tokens inventados do servidor web do KubeJS 7 nos testes da C-07 (base64 de frases de teste; o servidor é simulado). Só estes valores exatos."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^dG9rZW4tc2VjcmV0by1kby1rdWJlanM$''',
  '''^dG9rZW4tZG8tc2Vydmlkb3Itd2ViLWRvLWt1YmVqcy1lMmU$''',
  '''^c2VncmVkby1kby1rdWJlanMtcGFyYS10ZXN0ZXM_$''',
]

[[allowlists]]
description = "Nome de mod (`mod/bellsandwhistles`) na lista de resource packs de um crash report real do corpus adversário da assinatura (D-06); não é chave. Só este valor exato, só nesta pasta."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^mod/bellsandwhistles$''']
paths = ['''^crates[/\\]warden-diagnostics[/\\]tests[/\\]corpus-assinatura[/\\]''']
