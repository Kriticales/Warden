[package]
name = "warden-jarmeta"
description = "Leitura de metadados de jars sem extrair e índices pacote → mod e config de mixin → mod."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
sha1.workspace = true
tempfile.workspace = true
ureq.workspace = true

# Desempenho com o pack grande (A-04): `cargo bench -p warden-jarmeta`.
[[bench]]
name = "pack_grande"
harness = false

# Baixa um .mrpack público para medir com um pack real (A-04; docs/DESEMPENHO.md).
[[bench]]
name = "preparar_pack_real"
harness = false

[lints]
workspace = true
