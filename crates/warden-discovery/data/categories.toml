# Mapeamento curado de categorias (SPEC T08; ARCHITECTURE §17.1).
#
# Junta as categorias do Modrinth e da CurseForge sob um nome só, em português. Uma categoria
# sem par numa das fontes filtra apenas a fonte que a tem (a lista vazia significa "sem par").
#
# - `id`: estável (vai para a interface e para os testes); renomear é mudança de contrato.
# - `kinds`: onde a categoria aparece (`mod`, `resourcePack`, `shader`).
# - `modrinth`: nomes de `GET /v2/tag/category`.
# - `curseforge`: IDs de `GET /v1/categories?gameId=432&classId=<classe>` (6 mods, 12 resource
#   packs, 6552 shaders). Os IDs de mods vêm da documentação pública da CurseForge; os
#   resource packs e shaders da CurseForge ainda não têm par (só o Modrinth filtra).
#   Confira com `cargo xtask check-kits`/o painel de categorias quando houver chave.

