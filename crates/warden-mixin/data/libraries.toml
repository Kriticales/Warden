# O rebaixador "o mod declara o outro como dependência" (compatibilidade intencional) não vale
# quando o outro é uma destas: o Debugify depende da Fabric API em geral, não para conviver com
# a correção que os dois fazem no mesmo ponto. Ids como os descritores declaram (os módulos da
# Fabric API começam com `fabric-` e entram pela regra do prefixo em `src/overlap.rs`).

