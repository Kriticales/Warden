[package]
name = "warden-curseforge"
description = "Cliente da API da CurseForge, distribuição bloqueada e impressão digital murmur2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
warden-http.workspace = true
# `HashFormat` dos hashes esperados; o murmur2 da CurseForge mora na P1-01 e não é copiado.
warden-packwiz.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
