[package]
name = "warden-versioning"
description = "Git embutido: salvar versão, histórico, pontos de segurança, changelog e publicação no GitHub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
warden-packwiz.workspace = true
warden-http.workspace = true
# libgit2 compilada junto (`vendored-libgit2`), sem git instalado (ADR-0015). Sem `https` e
# `ssh`: a publicação (V-03) envia pelo protocolo "smart HTTP" sobre a `warden-http` (ADR-0059).
git2.workspace = true
async-trait.workspace = true
base64.workspace = true
regex.workspace = true
secrecy.workspace = true
serde_json.workspace = true
specta-typescript.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
semver.workspace = true
serde.workspace = true
specta = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
warden-http.workspace = true
wiremock.workspace = true
warden-core = { workspace = true, features = ["fault-injection"] }
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true

[lints]
workspace = true
