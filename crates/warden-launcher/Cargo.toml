[package]
name = "warden-launcher"
description = "Interface LauncherEngine, perfil offline, supervisão do processo do jogo e leitura de logs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warden-core.workspace = true
warden-java.workspace = true
warden-catalog.workspace = true
async-trait.workspace = true
# Saída do jogo: UTF-8 com recuo para Windows-1252 (ARCHITECTURE §7.4).
encoding_rs.workspace = true
# UUID offline: MD5 de "OfflinePlayer:<nome>" (ARCHITECTURE §7.2).
md-5.workspace = true
# Eventos XML do log4j na saída do jogo.
quick-xml.workspace = true
# Motor de instalação escolhido no S1 (ADR-0057), versão exata.
portablemc.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["derive"] }
specta-typescript.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Job Object: "Parar jogo" e fechar o Warden encerram o jogo e todos os filhos
# (ARCHITECTURE §7.4). O `unsafe` fica isolado em `src/process/windows.rs`.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Grupo de processos: SIGTERM e SIGKILL no grupo sem `unsafe`.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
warden-http.workspace = true
warden-catalog.workspace = true

[lints]
workspace = true
