# Grupos esperados do corpus adversário da assinatura (D-06, 4ª revisão).
#
# Cada caso é uma pasta com um crash report ou `latest.log` real (origem em FIXTURES.md). Casos
# com o mesmo `grupo` são o mesmo travamento e têm o mesmo hash; grupos diferentes, hashes
# diferentes. Nos casos que provam uma regra, as partes esperadas (`regra`, `excecao`, `frame`,
# `mods`, `sujeito`) também são conferidas; `frame = ""` é "sem frame". O teste
# `corpus_adversario_cada_caso_tem_as_partes_e_o_grupo_esperados` exige que todo caso esteja aqui,
# na ordem das pastas.

[[caso]]
nome = "fabric-1.20.1-autotag-lambda"
grupo = "fabric-1.20.1-autotag-lambda"
# Lambda de um mod na pilha: frame de mod, sem o número da lambda.
frame = "io.github.apace100.autotag.common.tags.AutoItemTags.lambda$register"
mods = ["mod:autotag", "mod:kilt"]

[[caso]]
nome = "fabric-1.20.1-configsync-desconectar-a"
grupo = "fabric-1.20.1-configsync-desconectar"
# O mesmo travamento em duas execuções (ids de mixin `fih002`/`fig002`, outra linha do
# `Collections`, outro launcher embaixo do `main`).
frame = "fuzs.forgeconfigapiport.impl.network.config.ConfigSync.lambda$unloadSyncedConfig"
sujeito = ["description=unexpected error", "where=net.minecraftforge.fml.config.ModConfig.acceptSyncedConfig"]

