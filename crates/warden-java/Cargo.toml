[package]
name = "warden-java"
description = 'Runtimes Java: descoberta, download, validação e política "mais novo que funciona".'
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Pontos de falha da instalação para os testes de injeção de falha (QUALITY §4.1).
fault-injection = ["warden-core/fault-injection"]

[dependencies]
async-trait.workspace = true
warden-core.workspace = true
warden-http.workspace = true
warden-packwiz.workspace = true
# Runtime do Linux em `.tar.gz` (Adoptium): descompressão e leitura do tar.
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["derive"] }
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
warden-core = { workspace = true, features = ["fault-injection"] }
wiremock.workspace = true

[lints]
workspace = true
