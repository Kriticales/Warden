# Kits de desempenho (ADR-0033; R1 §2.3.5; tarefa P1-18).
#
# Embutido no binário (`include_str!` em `src/kits.rs`) e conferido por `cargo xtask check-kits`
# (consulta a API do Modrinth por item e por versão da faixa) e pelos testes da crate. IDs do
# Modrinth, nunca slugs. Itens só da CurseForge levam `source = "curseforge"` e o ID do projeto.
#
# Um kit vale para um loader e uma faixa de versões do Minecraft (`from` e `to` inclusivas, `to`
# opcional). `check` são as versões que o `check-kits` consulta. Aplicar um kit passa sempre pelo
# diálogo de dependências, com tudo visível: nada entra em silêncio. Cada item tem o lado que o
# mod pede (`side`) e `checked` (se vem marcado). Um item `optional = true` vem desmarcado e
# `note` diz por quê (códigos traduzidos pela interface).
#
# A lista de cada kit é a de R1 §2.3.5, conferida na API do Modrinth em 07/10/2026; o que a API
# não mostra para a faixa vira aviso no `check-kits`, não erro.

