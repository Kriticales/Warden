# cargo-deny: licenças, avisos de segurança, fontes e duplicatas (QUALITY §10).
# Rodado por `cargo xtask check` (`cargo deny check`).

[graph]
# Só as plataformas do Warden: Windows (principal) e Linux (CI). Evita dependências de
# macOS, iOS e Android do Tauri no relatório.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Falhas de segurança em qualquer ponto da árvore reprovam. Crates sem manutenção só reprovam
# quando são dependência direta do workspace: as transitivas (sobretudo do GTK, usado pelo
# Tauri no Linux) são decisão das bibliotecas de cima.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # `zip` 6.0.0, só pelo `portablemc` =5.0.5 (L-02, ADR-0057; ainda no `zip` 6 no `main` de
  # cima: https://github.com/mindstorm38/portablemc/blob/main/rust/portablemc/Cargo.toml).
  # Os três alertas tratam só de `ZipArchive::extract` e `ZipStreamReader::extract`, que
  # gravam links simbólicos e aplicam as permissões Unix das entradas. O `portablemc` 5.0.5
  # nunca chama esses métodos: lê entrada por entrada (`by_name`/`by_index` e `io::copy`), sem
  # links nem permissões do zip, e as nativas passam por `enclosed_name` e ficam só com o nome
  # do arquivo (`src/base/mod.rs` e `src/forge/mod.rs`, conferidos na FIX-ZIP). As crates do
  # Warden usam o `zip` 9.0.4, já corrigido, e nenhuma chama `extract`. Remover estas linhas
  # quando o `portablemc` passar para o `zip` >= 9.
  { id = "RUSTSEC-2026-0367", reason = "zip 6 só no portablemc, que não usa extract (GHSA-vv5m-jxxh-4627)" },
  { id = "RUSTSEC-2026-0368", reason = "zip 6 só no portablemc, que não usa extract (GHSA-4v9h-p7m9-rh26)" },
  { id = "RUSTSEC-2026-0369", reason = "zip 6 só no portablemc, que não usa extract (GHSA-4684-h2q9-2vcp)" },
]

[licenses]
# O Warden é privado e nunca distribuído (ADR-0004): a lista cobre as licenças encontradas,
# e toda licença nova passa por revisão ao entrar aqui.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # ISC (permissiva, equivalente à MIT): `ring`, `rustls-webpki` e `untrusted`, do TLS da
  # `warden-http` (P1-03).
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # bzip2-1.0.6 (permissiva, estilo BSD): `libbz2-rs-sys`, via `zip` 6 do `portablemc` (L-02,
  # ADR-0057), que lê os instaladores do Forge/NeoForge.
  "bzip2-1.0.6",
  # BSL-1.0 (Boost; permissiva, sem exigência de aviso no binário): `clipboard-win` e
  # `error-code`, da `arboard` no Windows, pelo `tauri-plugin-clipboard-manager` (UI-03).
  # Registrada em THIRD_PARTY.md. Fica nesta lista, e não numa exceção por crate, porque o
  # `cargo xtask notices` (A-02) passa ao `cargo-about` só as licenças desta lista.
  "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
# Crates do workspace (publish = false) não têm licença declarada.
ignore = true

[bans]
# Versões repetidas vêm do Tauri e dos plugins; aparecem como aviso para acompanhar.
multiple-versions = "warn"
wildcards = "deny"
# Dependências por caminho entre as crates do workspace não são curinga.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
