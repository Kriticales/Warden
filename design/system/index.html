<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warden — Design System</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="components.css" />
<style>
  /* Estilos só da galeria (documentação). Usam os mesmos tokens. */
  body { background: var(--color-bg); }
  .gx { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .gx-nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: var(--space-4) var(--space-3) var(--space-8); border-right: var(--border-thin) solid var(--color-border); background: var(--color-bg-sunken); }
  .gx-nav .brand { margin: 0 var(--space-2) var(--space-4); }
  .gx-nav h2 { margin: var(--space-5) var(--space-2) var(--space-1); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-text-3); }
  .gx-nav a { display: block; padding: 5px var(--space-2); color: var(--color-text-2); text-decoration: none; font-size: var(--text-sm); }
  .gx-nav a:hover { background: var(--color-surface-2); color: var(--color-text); }
  .gx-nav a[aria-current="true"] { color: var(--color-text); box-shadow: inset 3px 0 0 var(--color-primary); background: var(--color-surface-1); }
  .gx-main { min-width: 0; padding: var(--space-8) var(--space-10) var(--space-16); }
  .gx-intro { max-width: 900px; margin-bottom: var(--space-10); }
  .gx-intro p { color: var(--color-text-2); max-width: 75ch; margin-top: var(--space-3); }
  .gx-sec { padding-top: var(--space-8); margin-top: var(--space-8); border-top: 4px solid transparent; border-image: repeating-linear-gradient(90deg, var(--color-border-strong) 0 8px, transparent 8px 12px) 4; scroll-margin-top: var(--space-4); }
  .gx-sec > h2 { font-family: var(--font-display); font-weight: var(--font-weight-semibold); font-size: var(--text-xl); letter-spacing: var(--tracking-display); text-shadow: var(--shadow-pixel-text); }
  .gx-sec > .lead { margin: var(--space-2) 0 var(--space-5); color: var(--color-text-2); max-width: 80ch; font-size: var(--text-sm); }
  .gx-sec h3 { margin: var(--space-6) 0 var(--space-3); font-size: var(--text-md); font-weight: var(--font-weight-bold); }
  .gx-rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-4); max-width: 1100px; }
  .gx-rules > div { padding: var(--space-3) var(--space-4); background: var(--color-surface-1); border: var(--border-thin) solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-2); }
  .gx-rules b { display: block; color: var(--color-text); margin-bottom: var(--space-1); }
  .gx-rules .do b::before { content: "Use: "; color: var(--color-ok-text); }
  .gx-rules .dont b::before { content: "Evite: "; color: var(--color-danger-text); }
  .gx-states { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-4) var(--space-3); padding: var(--space-5); background: var(--color-surface-1); border: var(--border-thin) solid var(--color-border); }
  .gx-states--wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .gx-states--1 { grid-template-columns: minmax(0, 1fr); }
  .gx-state { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); align-content: start; justify-items: start; }
  .gx-state > .gx-lbl { font-size: var(--text-2xs); font-weight: var(--font-weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-text-3); }
  .gx-state > .field, .gx-state > .omnibox, .gx-state > .memory, .gx-state > .inputwrap { width: 100%; }
  .gx-matrix { width: 100%; border-collapse: collapse; background: var(--color-surface-1); border: var(--border-thin) solid var(--color-border); }
  .gx-matrix th { font-size: var(--text-2xs); font-weight: var(--font-weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-text-3); text-align: left; padding: var(--space-3); border-bottom: var(--border-thin) solid var(--color-border); }
  .gx-matrix td { padding: var(--space-3); border-bottom: var(--border-thin) solid var(--color-border); vertical-align: middle; }
  .gx-matrix td:first-child { font-size: var(--text-sm); color: var(--color-text-2); white-space: nowrap; }
  .gx-scroll { overflow-x: auto; }
  .gx-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--space-3); }
  .gx-sw { display: grid; grid-template-rows: 56px auto; background: var(--color-surface-1); border: var(--border-thin) solid var(--color-border); }
  .gx-sw i { display: block; box-shadow: inset 0 -1px 0 var(--color-border); }
  .gx-sw div { padding: var(--space-2) var(--space-3); font-size: var(--text-xs); }
  .gx-sw code { display: block; color: var(--color-text); font-size: var(--text-xs); }
  .gx-sw span { color: var(--color-text-3); }
  .gx-type td { padding: var(--space-3); border-bottom: var(--border-thin) solid var(--color-border); vertical-align: baseline; }
  .gx-type td:first-child { width: 180px; font-size: var(--text-xs); color: var(--color-text-3); font-family: var(--font-mono); }
  .gx-spacer { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-text-3); font-family: var(--font-mono); }
  .gx-spacer i { display: block; height: 12px; background: var(--color-primary); }
  .gx-stage { position: relative; transform: translateZ(0); height: 440px; overflow: hidden; border: var(--border-thin) solid var(--color-border); background: var(--color-bg); }
  .gx-stage .scrim { position: absolute; }
  .gx-stage .fake { padding: var(--space-5); color: var(--color-text-3); font-size: var(--text-sm); }
  .gx-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--space-2); }
  .gx-icons div { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); background: var(--color-surface-1); font-size: var(--text-xs); color: var(--color-text-2); font-family: var(--font-mono); }
  .gx-tex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
  .gx-tex > div { border: var(--border-thin) solid var(--color-border); background: var(--color-surface-1); }
  .gx-tex .sample { height: 96px; position: relative; }
  .gx-tex p { padding: var(--space-3); font-size: var(--text-sm); color: var(--color-text-2); }
  .gx-motion { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-3); }
  .gx-motion > div { padding: var(--space-4); background: var(--color-surface-1); border: var(--border-thin) solid var(--color-border); display: grid; gap: var(--space-2); }
  .gx-motion .bar { height: 10px; background: var(--color-bg-sunken); position: relative; overflow: hidden; }
  .gx-motion .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: var(--color-primary); }
  .gx-motion > div:hover .bar i { transform: translateX(180px); }
  .gx-pack-demo { border: var(--border-thin) solid var(--color-border); overflow: hidden; }
  .gx-note { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--color-text-3); max-width: 90ch; }
  .gx-contrast { max-height: 420px; overflow: auto; border: var(--border-thin) solid var(--color-border); }
  .gx-contrast table { width: 100%; }
  .gx-chip { display: inline-block; width: 14px; height: 14px; vertical-align: -3px; margin-right: 6px; box-shadow: 0 0 0 1px var(--color-border-strong); }
  .gx-elev { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5); }
  .gx-elev > div { height: 96px; padding: var(--space-3); background: var(--color-surface-2); font-size: var(--text-xs); color: var(--color-text-2); }
  .gx-shape { display: flex; gap: var(--space-5); flex-wrap: wrap; align-items: center; }
  .gx-shape > div { display: grid; gap: var(--space-2); justify-items: center; font-size: var(--text-xs); color: var(--color-text-3); }
  .gx-shape i { display: block; width: 72px; height: 40px; background: var(--color-primary); }
  @media (max-width: 1100px) { .gx-main { padding: var(--space-6); } .gx-rules, .gx-tex { grid-template-columns: 1fr; } .gx-elev { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body class="dark">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<div class="gx">
  <nav class="gx-nav" aria-label="Seções do design system" id="gx-nav"></nav>
  <main class="gx-main" id="conteudo" tabindex="-1"></main>
</div>
<script src="icons.js"></script>
<script src="contraste.js"></script>
<script src="components.js"></script>
<script src="behavior.js"></script>
<script src="gallery.js"></script>
</body>
</html>
