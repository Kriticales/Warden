<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warden — Estrutura (rascunho)</title>
<style>
/* Rascunho de ESTRUTURA: só escala de cinza, fonte do sistema, caixas e texto.
   Nada aqui é proposta visual. */
:root {
  --ink: #111; --g1: #333; --g2: #595959; --g3: #8a8a8a; --g4: #c4c4c4;
  --g5: #e2e2e2; --g6: #f3f3f3; --paper: #fff; --desk: #dcdcdc;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }

/* ---------- Visualizador (fora da janela do app) ---------- */
.vbar { position: sticky; top: 0; z-index: 50; background: #1d1d1d; color: #f0f0f0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; }
.vbar h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
.vbar .seg { display: inline-flex; border: 1px solid #777; border-radius: 4px; overflow: hidden; }
.vbar .seg button { background: transparent; color: #ddd; border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
.vbar .seg button + button { border-left: 1px solid #777; }
.vbar .seg button[aria-pressed="true"] { background: #f0f0f0; color: #111; font-weight: 600; }
.vbar .approved { border: 1px solid #777; border-radius: 4px; padding: 5px 10px; font-size: 13px; color: #eee; }
.vbar label { display: inline-flex; gap: 6px; align-items: center; color: #ccc; font-size: 13px; cursor: pointer; }
.vbar .sp { flex: 1; }
.vbar a { color: #ddd; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 48px); }
.idx { background: #efefef; border-right: 1px solid #bbb; padding: 14px 12px 40px; font-size: 13px; }
.idx h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #555; margin: 18px 0 6px; }
.idx h2:first-child { margin-top: 0; }
.idx a { display: block; color: #222; text-decoration: none; padding: 3px 6px; border-radius: 3px; }
.idx a:hover { background: #ddd; }
.idx a[aria-current="page"] { background: #222; color: #fff; }
.idx .spec { color: #777; font-size: 11px; }
.idx a[aria-current="page"] .spec { color: #bbb; }
.idx-select { display: none; }

.stage { padding: 16px 20px 60px; min-width: 0; }
.note { background: #fafafa; border: 1px solid #aaa; border-left: 4px solid #333; padding: 10px 14px; margin-bottom: 14px; max-width: 1080px; }
.note h2 { margin: 0 0 4px; font-size: 17px; }
.note .meta { color: #555; font-size: 12px; margin-bottom: 6px; }
.note p { margin: 4px 0; max-width: 90ch; }
.note .arrows { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 20px; margin-top: 6px; font-size: 13px; }
.note .arrows ul { margin: 2px 0 0; padding-left: 18px; }
.note a { color: #111; }
.note .states { font-size: 13px; color: #333; }
.scroller { overflow-x: auto; padding-bottom: 8px; }

/* ---------- Janela do app (wireframe) ---------- */
.win { background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; width: 1080px; height: 680px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.win-bar { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid var(--g4); background: var(--g6); font-size: 12px; color: var(--g2); }
.win-body { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

.apptop { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1.5px solid var(--g4); }
.apptop .brand { font-weight: 700; font-size: 16px; }
.grow { flex: 1; }
.appmain { flex: 1; overflow: auto; padding: 22px 28px; min-height: 0; }
.foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-top: 1px solid var(--g4); font-size: 12px; color: var(--g2); background: var(--g6); }

/* cabeçalho do pack */
.phead { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-bottom: 2px solid var(--ink); }
.phead .id { min-width: 0; }
.phead .name { font-size: 18px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
.phead .sub { font-size: 12px; color: var(--g2); }
.phead .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.back { white-space: nowrap; }
.vsep { width: 1px; align-self: stretch; background: var(--g4); }

.pbody { flex: 1; display: flex; min-height: 0; }
.side { flex: none; width: 230px; border-right: 1.5px solid var(--g4); padding: 10px 8px; overflow: auto; }
.side .it { display: block; width: 100%; text-align: left; border: 1.5px solid transparent; background: none; font: inherit; padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; color: var(--ink); }
.side .it b { display: flex; justify-content: space-between; font-size: 14px; }
.side .it b span { font-weight: 400; font-size: 12px; color: var(--g2); }
.side .it small { display: block; color: var(--g2); font-size: 12px; }
.side .it.on { border-color: var(--ink); background: var(--g5); }
.content { flex: 1; overflow: auto; padding: 16px 18px; min-width: 0; }
.crumb { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--g4); font-size: 13px; color: var(--g2); flex: none; }

/* elementos */
.b { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--g1); background: var(--paper); color: var(--ink); padding: 5px 10px; font: inherit; font-size: 13px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.b.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.b.big { font-size: 15px; padding: 8px 18px; font-weight: 700; }
.b.link { border: 0; background: none; text-decoration: underline; padding: 2px 3px; color: var(--ink); }
.b.small { font-size: 12px; padding: 2px 7px; }
.b.ghost { border-style: dashed; }
.b[disabled] { opacity: .45; cursor: not-allowed; }
.split { display: inline-flex; }
.split .b:first-child { border-radius: 3px 0 0 3px; }
.split .b:last-child { border-radius: 0 3px 3px 0; border-left: 1px solid #666; padding: 8px 9px; }
.dead { cursor: help; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--g1); border-radius: 10px; padding: 1px 8px; font-size: 12px; background: var(--paper); cursor: pointer; white-space: nowrap; font-family: inherit; color: var(--ink); }
.chip.solid { background: var(--ink); color: #fff; }
.in { display: flex; align-items: center; border: 1.5px solid var(--g3); border-radius: 3px; padding: 5px 8px; color: var(--g3); background: var(--paper); min-height: 30px; font-size: 13px; }
.in.val { color: var(--ink); }
.sel::after { content: " ▾"; color: var(--g2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.box { border: 1.5px solid var(--g4); border-radius: 4px; padding: 12px 14px; background: var(--paper); }
.box.strong { border-color: var(--ink); }
.box.dash { border-style: dashed; }
.box h3, .content h3, .appmain h3 { margin: 0 0 6px; font-size: 15px; }
.content h2, .appmain h2 { margin: 0 0 4px; font-size: 19px; }
.muted { color: var(--g2); }
.small { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border: 1.5px solid var(--ink); border-radius: 2px; }
.tag.err { background: var(--ink); color: #fff; }
.tag.warn { border-style: solid; }
.tag.info { border-style: dotted; }
.tag.p1 { border-color: var(--g3); color: var(--g2); font-weight: 400; }
.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 600; color: var(--g2); font-size: 12px; border-bottom: 1.5px solid var(--g4); padding: 5px 6px; }
.t td { border-bottom: 1px solid var(--g5); padding: 6px; vertical-align: top; }
.t tr.selrow td { background: var(--g6); }
.grp { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 4px; font-weight: 700; font-size: 14px; }
.grp:first-child { margin-top: 0; }
.ic { display: inline-block; width: 22px; height: 22px; border: 1.5px solid var(--g3); background: var(--g5); vertical-align: middle; margin-right: 6px; border-radius: 3px; }
.ic.lg { width: 48px; height: 48px; }
.cb { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--g1); vertical-align: -2px; margin-right: 6px; text-align: center; font-size: 11px; line-height: 11px; }
.cb.on::after { content: "✓"; }
.rb { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--g1); border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
.rb.on { background: radial-gradient(circle, var(--ink) 40%, transparent 45%); }
.code { font-family: var(--mono); font-size: 12px; background: var(--g6); border: 1px solid var(--g4); padding: 8px 10px; white-space: pre; overflow: auto; line-height: 1.5; }
.code .del { text-decoration: line-through; color: var(--g2); }
.code .add { font-weight: 700; }
.steps { display: flex; gap: 0; border: 1.5px solid var(--g4); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.steps div { flex: 1; padding: 7px 10px; font-size: 12px; border-right: 1px solid var(--g4); color: var(--g2); }
.steps div:last-child { border-right: 0; }
.steps .done { color: var(--ink); }
.steps .done::before { content: "✓ "; }
.steps .now { background: var(--ink); color: #fff; font-weight: 700; }
.bar { height: 10px; border: 1.5px solid var(--g1); border-radius: 2px; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--g2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { border: 1.5px solid var(--g3); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.card.bad { border-style: dashed; border-color: var(--ink); }
.tree { font-size: 13px; line-height: 1.75; }
.tree .f { padding-left: 18px; }
.tree .on { background: var(--ink); color: #fff; padding: 0 4px; }
.split2 { display: grid; grid-template-columns: 250px 1fr; gap: 0; height: 100%; border: 1.5px solid var(--g4); border-radius: 4px; }
.split2 > div:first-child { border-right: 1.5px solid var(--g4); padding: 10px; overflow: auto; }
.split2 > div:last-child { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.banner { border: 1.5px solid var(--ink); border-left-width: 6px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.console { font-family: var(--mono); font-size: 12px; background: var(--g6); border: 1.5px solid var(--g3); padding: 8px; line-height: 1.55; height: 300px; overflow: auto; white-space: pre; }
.console .e { font-weight: 700; }
.console .w { text-decoration: underline dotted; }
hr.s { border: 0; border-top: 1px solid var(--g4); margin: 12px 0; }

/* sobreposições */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.38); display: flex; align-items: center; justify-content: center; z-index: 5; }
.dlg { background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; width: 600px; max-height: 92%; overflow: auto; padding: 18px 20px; }
.dlg.wide { width: 760px; }
.dlg h2 { margin: 0 0 8px; font-size: 18px; }
.dlg .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 400px; background: var(--paper); border-left: 2px solid var(--ink); overflow: auto; padding: 16px; z-index: 6; }
.menu { position: absolute; z-index: 6; background: var(--paper); border: 2px solid var(--ink); border-radius: 3px; min-width: 300px; padding: 4px 0; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; font: inherit; padding: 7px 14px; cursor: pointer; color: var(--ink); }
.menu button:hover { background: var(--g5); }
.menu hr { border: 0; border-top: 1px solid var(--g4); margin: 4px 0; }

/* realce de áreas clicáveis (opção do visualizador) */
body.showclick .win [data-go]:not([data-go=""]) { outline: 2px dashed #000; outline-offset: 1px; }
.win [data-go]:not([data-go=""]):hover { outline: 2px solid #000; outline-offset: 1px; }

/* ---------- Páginas do visualizador: mapa e fluxos ---------- */
.doc { background: var(--paper); border: 1px solid #aaa; padding: 20px 24px; max-width: 1080px; }
.doc h2 { margin: 0 0 6px; font-size: 22px; }
.doc h3 { margin: 22px 0 6px; font-size: 16px; }
.doc p, .doc li { max-width: 85ch; }
.maptree { font-family: var(--mono); font-size: 13px; white-space: pre; background: var(--g6); border: 1px solid var(--g4); padding: 12px 14px; overflow-x: auto; line-height: 1.55; }
.maptree a { color: #000; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; margin: 8px 0 4px; }
.flow a { border: 1.5px solid #222; background: #fff; padding: 6px 9px; border-radius: 3px; color: #111; text-decoration: none; font-size: 13px; }
.flow a:hover { background: #222; color: #fff; }
.flow .arr { font-size: 16px; color: #333; padding: 0 2px; }
.flow .act { font-size: 12px; color: #444; font-style: italic; }
.cmp { border-collapse: collapse; width: 100%; font-size: 13px; }
.cmp th, .cmp td { border: 1px solid #bbb; padding: 6px 8px; text-align: left; vertical-align: top; }
.cmp th { background: #eee; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .idx { display: none; }
  .idx-select { display: block; width: 100%; margin-bottom: 10px; padding: 8px; font: inherit; }
  .stage { padding: 12px 16px 40px; }
  .doc { padding: 16px; }
}
</style>
</head>
<body class="light">
<div class="vbar" role="banner">
  <h1>Warden — Estrutura (rascunho)</h1>
  <span class="approved">Alternativa A · aprovada pelo dono em 01/10/2026</span>
  <label><input type="checkbox" id="showclick" /> Mostrar o que é clicável</label>
  <span class="sp"></span>
  <a href="#" data-nav="mapa">Mapa</a>
  <a href="#" data-nav="fluxos">Fluxos</a>
</div>
<div class="layout">
  <nav class="idx" id="idx" aria-label="Telas do rascunho"></nav>
  <main class="stage" id="stage">
    <select class="idx-select" id="idxsel" aria-label="Escolher tela"></select>
    <div id="view"></div>
  </main>
</div>

<script>
"use strict";
/* ======================================================================
   Dados de exemplo (pack fictício "Vale Sereno", Forge 1.20.1)
   ====================================================================== */
const PACK = { name: "Vale Sereno", mc: "1.20.1", loader: "Forge 47.3.0", ver: "1.4.2" };

/* ======================================================================
   Componentes
   ====================================================================== */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// go = id da tela de destino; "" = não ligado neste rascunho
function btn(label, go, cls) {
  const g = go || "";
  const dead = g ? "" : ' dead" title="Não ligado neste rascunho';
  return `<button type="button" class="b ${cls || ""}${dead}" data-go="${g}">${label}</button>`;
}
function chip(label, go, cls) {
  return `<button type="button" class="chip ${cls || ""}" data-go="${go || ""}">${label}</button>`;
}
function input(ph, val) { return `<div class="in ${val ? "val" : ""}">${val || ph}</div>`; }
function select(label) { return `<div class="in val sel">${label}</div>`; }
function cb(on) { return `<span class="cb ${on ? "on" : ""}"></span>`; }
function rb(on) { return `<span class="rb ${on ? "on" : ""}"></span>`; }
function tag(kind, text) { return `<span class="tag ${kind}">${text}</span>`; }
function p1() { return tag("p1", "P1"); }

function win(inner) {
  return `<div class="scroller"><div class="win" role="img" aria-label="Rascunho da janela do Warden">
    <div class="win-bar"><span>Warden</span><span>_&nbsp;&nbsp;▢&nbsp;&nbsp;✕</span></div>
    <div class="win-body">${inner}</div></div></div>`;
}
function foot(text) {
  return `<div class="foot">${chip(text || "Nenhuma tarefa em andamento", "tarefas")}<span class="grow"></span><span>Versão do Warden 0.1.0</span></div>`;
}
function dialog(inner, wide) { return `<div class="scrim"><div class="dlg ${wide ? "wide" : ""}">${inner}</div></div>`; }
function drawer(inner) { return `<div class="drawer">${inner}</div>`; }

/* ---------- Nível do APP ---------- */
function appShell(content, o) {
  o = o || {};
  const left = o.back ? btn("← " + o.back[0], o.back[1], "link back") + '<span class="vsep"></span>' : "";
  return `<div class="apptop">${left}<span class="brand">Warden</span><span class="muted">${o.title || "Meus packs"}</span>
      <span class="grow"></span>${o.noSettings ? "" : btn("Configurações", "config-app", "link")}</div>
    <div class="appmain">${content}</div>${foot(o.foot)}${o.overlay || ""}`;
}

/* ---------- Nível do PACK ---------- */
const SECTIONS = [
  ["mods", "Mods", "Mods, resource packs e shaders", "128"],
  ["configs", "Configs", "Arquivos de ajuste dos mods e do jogo", ""],
  ["problemas", "Problemas", "O que pode impedir o jogo de abrir", "3"],
  ["ia", '<i aria-hidden="true" style="font-style:normal">✦</i> Diagnóstico com IA', "Pedir à IA para explicar um travamento", ""],
  ["historico", "Histórico", "Versões salvas e publicação", "5 não salvas"],
  ["exportar", "Exportar", "Gerar o pack para quem vai jogar", ""],
];
const TITLES = { mods: "Mods, resource packs e shaders", adicionar: "Adicionar", configs: "Configs", problemas: "Problemas", ia: "Diagnóstico com IA",
  historico: "Histórico", exportar: "Exportar", teste: "Teste", info: "Informações do pack" };

function packHeader(alt, o) {
  const game = o.game;
  let testBtn;
  if (game === "running") {
    testBtn = btn("● Jogo aberto: ver teste", "teste-jogo", "primary big");
  } else if (game === "preparing") {
    testBtn = btn("Testando… ver progresso", "teste-preparo", "primary big");
  } else {
    testBtn = `<span class="split">${btn("▶&nbsp;Testar", "teste-checagem", "primary big")}${btn("▾", "testar-menu", "primary")}</span>`;
  }
  const chips = [];
  if (o.review) chips.push(chip("Mudanças do teste para revisar", "teste-fechou", "solid"));
  // Os contadores (problemas, itens) ficam no menu lateral; o cabeçalho só mostra avisos passageiros.
  if (o.packChanged) chips.push(chip("O pack mudou desde o início do teste", ""));
  return `<div class="phead">
      ${btn("← Meus packs", "packs", "link back")}<span class="vsep"></span>
      <div class="id"><div class="name">${PACK.name} ${btn("Editar informações", "info", "link small")}</div>
        <div class="sub">Minecraft ${PACK.mc} · ${PACK.loader} · versão do pack ${o.saved ? "1.5.0" : PACK.ver}</div></div>
      <div class="chips">${chips.join("")}</div>
      <span class="grow"></span>
      ${btn(o.saved || o.noProblems ? "Salvar versão" : "Salvar versão · 5 alterações", "salvar", "")}
      ${testBtn}
    </div>`;
}

// sec: seção ativa no menu lateral do pack ("teste" não acende nenhum item).
function packShell(alt, sec, content, o) {
  o = o || {};
  const items = SECTIONS.map(([id, label, desc, count]) =>
    `<button type="button" class="it ${id === sec || (sec === "adicionar" && id === "mods") ? "on" : ""}" data-go="${id}">
      <b>${label}<span>${count}</span></b><small>${desc}</small></button>`).join("");
  const body = `<div class="pbody"><nav class="side" aria-label="Seções do pack">${items}</nav>
    <div class="content">${content}</div></div>`;
  return packHeader(alt, o) + body + foot(o.foot) + (o.overlay || "");
}

/* ======================================================================
   Conteúdos (compartilhados pelas duas alternativas)
   ====================================================================== */
function modsContent(o) {
  o = o || {};
  const rows = [
    [true, "Create", "0.5.1.j", "Modrinth", "Cliente e servidor", "Em dia", ""],
    [false, "Just Enough Items (JEI)", "15.20.0.106", "CurseForge", "Cliente e servidor", "Atualização: 15.20.0.112", ""],
    [false, "Embeddium", "0.3.31", "Modrinth", "Só cliente", "Em dia", ""],
    [false, "Rubidium", "0.7.1", "Arquivo local", "Só cliente", "Não se aplica", tag("err", "ERRO")],
    [false, "Waystones", "14.1.6", "Modrinth", "Cliente e servidor", "Em dia", tag("err", "ERRO")],
    [false, "Xaero's Minimap", "24.6.1", "CurseForge", "Cliente e servidor", "Atualização: 24.6.2", tag("warn", "AVISO")],
    [false, "Farmer's Delight", "1.2.6", "Modrinth", "Cliente e servidor", "Em dia", ""],
  ];
  const tr = rows.map(r => `<tr class="${r[0] ? "selrow" : ""}"><td>${cb(r[0])}</td>
      <td><button type="button" class="b link" data-go="${r[1].startsWith("Just") ? "mods-detalhe" : ""}"><span class="ic"></span>${r[1]}</button></td>
      <td>${r[2]}</td><td>${r[3]}</td><td>${r[4]} ▾</td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join("");

function createContent(step) {
  const names = ["Nome e pasta", "Versão do Minecraft", "Loader", "Resumo"];

  let body;

      <div><b>Autor</b>${input("", "Kriticales")}</div><div><b>Descrição</b> <span class="muted small">(opcional)</span>${input("Uma frase sobre o pack")}</div>
      <div><b>Pasta</b><div class="row">${input("", "Documentos\\Warden\\vale-sereno")}${btn("Escolher…", "")}</div></div></div>`;
  else if (step === 1) body = `<div style="max-width:560px"><div class="row">${input("Buscar versão…")}<span class="small muted">Lista de versões de hoje</span></div>
      <div class="box stack small" style="margin-top:8px">${["1.21.9", "1.21.8", "1.21.1", "1.20.4", "1.20.1", "1.19.2", "1.18.2", "1.16.5", "1.12.2", "1.7.10"].map(v => `<div>${rb(v === "1.20.1")}${v}</div>`).join("")}

  else body = `<div class="box stack" style="max-width:560px"><div><b>Vale Sereno</b> por Kriticales</div><div>Minecraft 1.20.1 · Forge 47.3.0 · versão inicial 0.1.0</div>

  return `<h2>Criar pack</h2>${st}${body}<div class="row" style="margin-top:18px;max-width:560px;justify-content:space-between">${prev}${next}</div>`;

];
function flowsPage() {
  const a = state.alt;
  const html = FLOWS.map(f => {
    const st = f.steps[a];
    const acts = f.actsA || f.acts;
    const parts = st.map((s, i) => (i ? `<span class="arr">→</span><span class="act">${acts[i - 1] || ""}</span><span class="arr">→</span>` : "") + L(s[0], s[1]));
    const extra = (f.extra || []).map(e => `<div class="small">↳ ${L(e[0], e[1])}</div>`).join("");
    return `<h3>${f.name}</h3><div class="flow">${parts.join("")}</div>${extra}<div class="small">${st.length - 1} cliques/etapas</div>`;
  }).join("");
  return `<div class="doc"><h2>Fluxos principais</h2>
    <p>Cada caixa abre a tela correspondente; o texto em itálico é o botão que leva à próxima. O caminho do dia a dia é: abrir pack → adicionar mods → ajustar configs → testar → ver o que mudou → salvar versão → exportar.</p>${html}</div>`;
}

function resolve(id) {

}

  for (const [label, g] of groups) {
    html += `<h2>${label}</h2>`;
    opts += `<optgroup label="${label}">`;
    if (!g) {
      html += `<a href="#${state.alt}/mapa" data-id="mapa">Mapa e decisões</a><a href="#${state.alt}/fluxos" data-id="fluxos">Fluxos principais</a>`;
      opts += `<option value="mapa">Mapa e decisões</option><option value="fluxos">Fluxos principais</option>`;
    } else {
      for (const s of Object.values(S)) {
        if (s.group !== g || (s.only && s.only !== state.alt)) continue;
        if (s.hidden) continue;
        html += `<a href="#${state.alt}/${s.id}" data-id="${s.id}">${s.title} <span class="spec">${s.spec}</span></a>`;
        opts += `<option value="${s.id}">${esc(s.title)}</option>`;
      }
    }
    opts += `</optgroup>`;
  }
  html += `<h2>Outras telas</h2><div class="spec" style="padding:0 6px">Diálogos e menus (atualizar, remover, salvo, exportado, voltar versão, parar jogo…) abrem clicando nas próprias telas.</div>`;
  document.getElementById("idx").innerHTML = html;
  document.getElementById("idxsel").innerHTML = opts;
}

function render() {
  const view = document.getElementById("view");
  const id = state.screen;
  if (id === "mapa") view.innerHTML = mapPage();
  else if (id === "fluxos") view.innerHTML = flowsPage();
  else {
    const s = S[id];
    const link = ([label, to]) => `<li><a href="#${state.alt}/${resolve(to)}">${label}</a></li>`;
    const from = Object.values(S).filter(o => (o.to || []).some(t => resolve(t[1]) === id) && o.id !== id && !(o.only && o.only !== state.alt))
      .slice(0, 6).map(o => `<li><a href="#${state.alt}/${o.id}">${o.title}</a></li>`).join("");
    view.innerHTML = `<div class="note"><h2>${s.title}</h2>
      <div class="meta">SPEC: ${s.spec} · ${s.group === "app" ? "nível do app" : "nível do pack"}</div>
      <p>${s.note || ""}</p>
      <div class="arrows"><div><b>← Chega aqui por</b><ul>${from || "<li>início do app</li>"}</ul></div>
        <div><b>→ Daqui vai para</b><ul>${(s.to || []).map(link).join("")}</ul></div></div>
      ${s.states ? `<div class="states"><b>Outros estados desta tela:</b> ${s.states.join(" · ")}</div>` : ""}</div>
      ${win(s.render(state.alt))}`;
  }
  document.querySelectorAll("#idx a").forEach(a => a.setAttribute("aria-current", a.dataset.id === id ? "page" : "false"));
  document.getElementById("idxsel").value = id;
}

function fromHash() {
  const m = (location.hash || "").replace(/^#/, "").split("/");
  const alt = "A"; // a Alternativa B foi descartada; links antigos com "B/" abrem a mesma tela na A
  let id = m[1] || "mapa";
  const altChanged = alt !== state.alt;
  state.alt = alt;
  if (id !== "mapa" && id !== "fluxos") { id = resolve(id); if (!S[id]) id = "mapa"; }
  state.screen = id;
  if (altChanged || !document.getElementById("idx").innerHTML) buildIndex();
  render();
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { e.preventDefault(); location.hash = state.alt + "/" + nav.dataset.nav; return; }
  const g = e.target.closest(".win [data-go]");
  if (g && g.dataset.go) { e.preventDefault(); go(g.dataset.go); }
});
document.getElementById("idxsel").addEventListener("change", e => { location.hash = state.alt + "/" + e.target.value; });
document.getElementById("showclick").addEventListener("change", e => {
  document.body.classList.toggle("showclick", e.target.checked);
  storeSet("warden-estrutura-click", e.target.checked ? "1" : "0");
});
if (storeGet("warden-estrutura-click") === "1") { document.getElementById("showclick").checked = true; document.body.classList.add("showclick"); }
window.addEventListener("hashchange", fromHash);
state.alt = "";
fromHash();
</script>
</body>
</html>
