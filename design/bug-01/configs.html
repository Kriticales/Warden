.l3.is-nav { grid-template-columns: 280px minmax(0, 1fr); }
.l3 > .nav { overflow: hidden; }
.l3:not(.is-nav) > .nav { visibility: hidden; border: 0; }
.wrap3 { max-width: 1180px; margin: 0 auto; }
.navmod { padding: var(--space-3) var(--space-4) var(--space-1); font-size: var(--text-sm); font-weight: 700; color: var(--color-text); display: flex; align-items: center; gap: var(--space-2); }
.navmod .n { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500; color: var(--color-text-3); }

/* Comparar lado a lado */
.cmpsum { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin-top: var(--space-5); padding: var(--space-3) var(--space-4); background: var(--color-surface-1); box-shadow: inset 0 0 0 1px var(--color-border-strong); font-size: var(--text-sm); line-height: var(--lh-sm); }
.cmpsum__t { flex: 1 1 320px; min-width: 0; color: var(--color-text-2); }
.cmpsum__t b { color: var(--color-text); }
.cmphead, .cr { display: grid; grid-template-columns: minmax(0, 1fr) 236px 76px 236px; gap: var(--space-2) var(--space-4); align-items: start; }
.cmphead { position: sticky; top: 0; z-index: 2; margin-top: var(--space-4); padding: var(--space-3) 0 var(--space-2); background: var(--color-bg); border-bottom: 1px solid var(--color-border-strong); font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: 700; color: var(--color-text-2); }
.cmphead > div { display: flex; flex-direction: column; gap: 2px; }
.cmphead .t { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--color-text); }
.cmphead .t .icon { width: 14px; height: 14px; }
.cmphead .s { font-weight: 500; color: var(--color-text-3); }
.cmphead .test .icon { color: var(--place-test); }
.cmphead .pack .icon { color: var(--place-pack); }
.cr { padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
.cr__mid { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 2px; }
.cr__mid .btn { width: 32px; padding: 0; }
.cr__pack { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-text-2); }
.cr__pack small { font-family: var(--font-ui); font-size: var(--text-xs); color: var(--color-text-3); }
.cr.is-diff { background: linear-gradient(90deg, transparent, transparent); }
.cr.is-diff .cr__pack { color: var(--place-pack); }
.cr.is-same { opacity: 0.72; }
.cr.is-same:hover { opacity: 1; }
.cr .eq { font-size: var(--text-xs); color: var(--color-text-3); padding-top: 8px; }

/* Ir para arquivo (Ctrl+P) */
.qo { position: fixed; inset: 0; z-index: 55; background: var(--color-overlay); display: flex; justify-content: center; align-items: flex-start; padding-top: 140px; animation: fade-in var(--duration-base) var(--ease-out); }
.qo__box { width: min(640px, calc(100vw - 48px)); background: var(--color-surface-1); border: 1px solid var(--color-border-strong); box-shadow: 0 0 0 1px var(--color-pixel-shadow), var(--shadow-block-3); animation: dialog-in var(--duration-base) var(--ease-out); }
.qo__in { padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
.qo__list { max-height: 420px; overflow-y: auto; padding: var(--space-1) 0; }
.qo__item { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-4); border: 0; background: transparent; text-align: left; color: var(--color-text); }
.qo__item:hover, .qo__item.is-hot { background: var(--color-primary-soft); box-shadow: inset 3px 0 0 var(--color-primary); }
.qo__item .icon { color: var(--color-text-3); }
.qo__item .m { font-weight: 600; font-size: var(--text-sm); }
.qo__item .p { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-3); margin-left: var(--space-2); }
.qo__foot { display: flex; gap: var(--space-4); padding: var(--space-2) var(--space-4); border-top: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-text-3); }

/* ---------- Janela mais estreita ---------- */
@media (max-width: 1360px) {
  :root { --size-nav: 268px; --size-det: 296px; }
  .tbl__head, .trow { grid-template-columns: minmax(140px, 1fr) minmax(200px, 1.8fr) 180px 110px; }
  .tbl__head > :nth-child(5), .trow .trow__w { display: none; }
  .cmphead, .cr { grid-template-columns: minmax(0, 1fr) 210px 68px 200px; }

/* Grupos por lugar na árvore e filtros empilhados */
.tgroup--pack .icon { color: var(--place-pack); }
.tgroup--test .icon { color: var(--place-test); }
.tgroup--own .icon { color: var(--place-own); }
.tgroup { padding-top: var(--space-5); }
.nav__list > .tgroup:first-child { padding-top: var(--space-2); }
.tnote { padding: 0 var(--space-4) var(--space-2); font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--color-text-3); }
.fchips--stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }
.fchips--stack .fchip { justify-content: flex-start; width: 100%; }
.fchips--stack .fchip .n { margin-left: auto; }
.det .acts { flex-direction: column; align-items: stretch; }
.cr.is-diff .fr__t::before { content: ""; width: 6px; height: 6px; flex: none; background: var(--color-warn); }
.cr .select { height: 32px; font-family: var(--font-mono); font-size: var(--text-xs); }
.cr .input--text { height: 32px; font-family: var(--font-mono); font-size: var(--text-xs); }
.pghead .origin { width: 440px; }
/* Formulário: 3 colunas só com bastante largura; senão o padrão e o pack ficam sob o campo */
.fr { grid-template-columns: minmax(0, 1fr) 248px; }
.fr__m { grid-column: 2; padding-top: 0; }
@container (min-width: 900px) {
  .fr { grid-template-columns: minmax(0, 1fr) 232px 220px; }
  .fr__m { grid-column: 3; padding-top: 6px; }
}
.fr__l { grid-row: span 2; }
.fr__c { grid-column: 2; }
@container (min-width: 900px) { .fr__l { grid-row: auto; } .fr__c { grid-column: 2; } }
@container (max-width: 560px) {
  .fr { grid-template-columns: minmax(0, 1fr); }
  .fr__l { grid-row: auto; }
  .fr__c, .fr__m { grid-column: 1; }
}
@media (max-width: 1360px) { .nav .qbox kbd { display: none; } .nav .qbox .input { padding-right: var(--space-3); } }
.edtools--in { padding: var(--space-4) 0 0; border-bottom: 0; }
.tbl__head > span { white-space: nowrap; }
.edfoot > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.edfoot__end { flex: none; }

/* Encaixe: abaixo de 1280 px a janela do app é desenhada em 1280 e reduzida por inteiro (nada espremido nem cortado) */
.fit { position: relative; min-height: 0; overflow: hidden; }
.fit > .win { position: absolute; top: 0; left: 0; min-width: 0; transform-origin: 0 0; }
.skbar.is-mini #skTxt { display: block; }
.skbar.is-mini #skTxt p { display: none; }
.skbar.is-mini #skTxt .skbar__pc { margin-top: 2px; }

  const filterChips = (origin, stacked) => {
    const files = FILES.filter((f) => inOrigin(f, origin));
    const nc = files.filter((f) => changedCount(f, origin) > 0).length;
    const nd = files.filter((f) => diffCount(f) > 0).length;
    return `<div class="fchips ${stacked ? "fchips--stack" : ""}" role="group" aria-label="Filtros">
      <button type="button" class="fchip" data-act="fchg" aria-pressed="${S.fChanged}" title="Só arquivos com chaves diferentes do padrão que o próprio arquivo informa">${stacked ? "Só o que mudou do padrão" : "Mudou do padrão"} <span class="n">${nc}</span></button>
      ${origin === "test" ? `<button type="button" class="fchip fchip--test" data-act="fdiff" aria-pressed="${S.fDiff}" title="Só arquivos em que o teste local está diferente do pack"><span class="sq"></span>${stacked ? "Só o que difere do pack" : "Diferente do pack"} <span class="n">${nd}</span></button>` : ""}
    </div>`;
  };
  function filtered(origin) {
    return FILES.filter((f) => inOrigin(f, origin) && f.where !== "personal")
      .filter((f) => !S.fChanged || changedCount(f, origin) > 0)
      .filter((f) => !S.fDiff || origin !== "test" || diffCount(f) > 0)
      .filter((f) => !S.mod || f.mod === S.mod);
  }
  const personal = () => FILES.filter((f) => f.where === "personal");

  function mark(f, origin, quiet) {
    const d = diffCount(f);
    const dirty = dirtyCount(f, origin) > 0 ? `<span class="mk mk--dirty" title="Alterações não salvas"></span>` : "";
    if (quiet && f.where !== "both") return dirty;
    if (f.where === "personal") return dirty + `<span class="mk mk--own" title="Preferência pessoal: só neste computador">${ic("lock")}</span>`;
    if (f.where === "test") return dirty + `<span class="mk mk--new" title="Só existe no teste local. Os jogadores não recebem.">fora do pack</span>`;
    if (d) return dirty + `<span class="mk mk--diff" title="${origin === "test" ? `${plural(d, "chave diferente", "chaves diferentes")} do pack` : `O teste local tem ${plural(d, "diferença", "diferenças")}`}">${d}</span>`;
    return dirty;
  }

  /* Árvore por pastas (opção 1), separada por lugar */
  function folderTree(files, origin, pre) {
    const root = { dirs: {}, files: [] };
    files.forEach((f) => {
      const parts = f.p.split("/");
      let node = root;
      parts.slice(0, -1).forEach((part, i) => {
        const path = parts.slice(0, i + 1).join("/");
        node.dirs[part] = node.dirs[part] || { path, dirs: {}, files: [] };
        node = node.dirs[part];
      });
      node.files.push(f);
    });
    const count = (n) => n.files.length + Object.values(n.dirs).reduce((a, d) => a + count(d), 0);
    const filtering = S.fChanged || S.fDiff || S.mod;
    const render = (node, lvl) => {
      let h = "";
      Object.keys(node.dirs).sort((a, b) => a.localeCompare(b)).forEach((name) => {
        const d = node.dirs[name];
        const key = pre + d.path;
        const open = filtering || S.open.has(key) || files.some((f) => f.p === S.file && f.p.startsWith(d.path + "/"));
        h += `<button type="button" class="tnode tnode--dir" role="treeitem" aria-expanded="${open}" data-dir="${key}" style="--lvl:${lvl}">${ic("chevron-right", "tnode__chev")}${ic(open ? "folder-open" : "folder")}<span class="tnode__name">${name}</span><span class="tnode__end">${count(d)}</span></button>`;
        if (open) h += `<div role="group">${render(d, lvl + 1)}</div>`;
      });
      node.files.sort((a, b) => a.p.localeCompare(b.p)).forEach((f) => {
        h += `<button type="button" class="tnode tnode--file" role="treeitem" aria-selected="${S.file === f.p}" data-file="${f.p}" title="${f.p}" style="--lvl:${lvl}"><span></span>${ic(fmtOf(f) === "js" ? "file-code" : "file")}<span class="tnode__name">${fileName(f)}</span><span class="tnode__end">${mark(f, origin, true)}</span></button>`;
      });
      return h;
    };
    return render(root, 0);
  }
  function tree(origin) {
    const files = filtered(origin);
    const inPack = files.filter((f) => f.where === "both");
    const onlyTest = files.filter((f) => f.where === "test");
    let h = "";
    if (origin === "test") {
      h += `<div class="tgroup tgroup--pack">${ic("users")}No pack<span class="n">${inPack.length}</span></div>`;
      h += inPack.length ? `<div role="tree" aria-label="Configs que estão no pack">${folderTree(inPack, origin, "p:")}</div>` : `<p class="tnote">Nenhuma com esses filtros.</p>`;
      h += `<div class="tgroup tgroup--test">${ic("monitor")}Só no teste<span class="n">${onlyTest.length}</span></div><p class="tnote">O jogo criou ao abrir. Os jogadores não recebem.</p>`;
      h += onlyTest.length ? `<div role="tree" aria-label="Configs que estão só no teste">${folderTree(onlyTest, origin, "t:")}</div>` : "";
      h += `<div class="tgroup tgroup--own">${ic("lock")}Só neste computador<span class="n">${personal().length}</span></div><p class="tnote">Preferências pessoais. Voltam em todo teste.</p>`;
      h += personal().map((f) => `<button type="button" class="tnode tnode--file tnode--friendly" role="treeitem" aria-selected="${S.file === f.p}" data-file="${f.p}" title="${f.p}" style="--lvl:0"><span></span>${ic(f.p === "options.txt" ? "gamepad" : "file")}<span class="tnode__name">${f.label}<span class="sub">${fileName(f)}</span></span><span class="tnode__end">${mark(f, origin, true)}</span></button>`).join("");
    } else {
      h += inPack.length ? `<div role="tree" aria-label="Configs do pack">${folderTree(inPack, origin, "p:")}</div>` : `<p class="res__empty">Nenhum arquivo com esses filtros.</p>`;
      const only = FILES.filter((f) => f.where === "test").length;
      h += `<div class="hintbox"><span><strong>${only} configs estão só no teste.</strong> O jogo criou esses arquivos ao abrir. Os jogadores só recebem o que você trouxer para o pack.</span><button type="button" class="btn btn--sm" data-act="goTest">${ic("monitor", "icon--sm")}Ver no teste local</button></div>`;
    }
    return h;
  }

  function results(origin) {
    const res = search(S.q, origin);
    if (!res.length) return `<p class="res__empty">Nada encontrado para “${esc(S.q.trim())}”${origin === "pack" ? " no pack. Tente no teste local, onde ficam as configs que o jogo criou." : "."}</p>`;
    const nh = res.reduce((a, r) => a + Math.max(r.hits.length, 1), 0);
    return `<p class="res__sum">${plural(nh, "resultado", "resultados")} em ${plural(res.length, "arquivo", "arquivos")}</p>` + res.map(({ f, hits }) => `
      <button type="button" class="res__file" data-file="${f.p}"><span class="res__mod">${esc(nameOf(f))}</span><span class="tnode__end">${mark(f, origin)}</span><span class="res__path">${hl(f.p, S.q)}</span></button>
      ${hits.slice(0, 3).map((h) => h.k
        ? `<button type="button" class="res__hit" data-file="${f.p}" data-key="${h.k.k}"><span class="k">${hl(h.k.k, S.q)}</span><span class="v">${hl(h.v, S.q)}</span><span class="s">${hl(h.k.l, S.q)}</span></button>`
        : `<button type="button" class="res__hit" data-file="${f.p}"><span class="k">${hl(h.line, S.q)}</span><span class="v">linha ${h.i + 1}</span></button>`).join("")}`).join("");
  }

  /* =================== Editor =================== */
  const tomlv = (v, ty) => (typeof v === "string" ? `"${v}"` : ty === "float" && Number.isInteger(v) ? v.toFixed(1) : String(v));
  function textLines(f, origin) {
    // [{x: texto, key}] para o arquivo na origem
    const out = [];
    const R = raw(f);
    if (R) {
      R.v.split("\n").forEach((x, i) => {
        const t = origin !== "pack" && R.t && R.t[i] !== undefined ? R.t[i] : null;
        out.push({ x: t || x, diff: t ? x : null });
      });
      return out;
    }
    const D = doc(f);
    const fmt = D.fmt;
    if (fmt === "json") {
      out.push({ x: "{" });
      const secs = D.secs;
      secs.forEach((s, si) => {
        const ind = s.id ? "    " : "  ";
        if (s.id) out.push({ x: `  "${s.id}": {` });
        s.keys.forEach((k, ki) => {
          const last = ki === s.keys.length - 1;
          out.push({ x: `${ind}"${k.k}": ${typeof val(f, k, origin) === "string" ? `"${val(f, k, origin)}"` : show$(val(f, k, origin))}${last ? "" : ","}`, key: k });
        });
        if (s.id) out.push({ x: `  }${si === secs.length - 1 ? "" : ","}` });
      });
      out.push({ x: "}" });
      return out;
    }
    if (fmt === "options") {
      allKeys(f).forEach((k) => out.push({ x: `${k.k}:${show$(val(f, k, origin))}`, key: k }));
      return out;
    }
    if (fmt === "properties") {
      out.push({ x: `#${nameOf(f)}` });
      allKeys(f).forEach((k) => out.push({ x: `${k.k}=${show$(val(f, k, origin))}`, key: k }));
      return out;
    }
    if (D.note) out.push({ x: "# Config inicial escrita pelo Warden (só chaves documentadas pelo autor do Crash Assistant)." }, { x: "# Pode editar à vontade: o Warden não reescreve este arquivo." });
    D.secs.forEach((s, si) => {
      const tab = s.id ? "\t" : "";
      if (s.id) out.push({ x: `[${s.id}]` });
      s.keys.forEach((k) => {
        if (k.c) out.push({ x: `${tab}#${D.neo ? "" : " "}${k.c}` });
        if (k.r && D.neo) out.push({ x: `${tab}# Range: ${k.r[0]} ~ ${k.r[1]}` });
        if (k.o && D.neo) out.push({ x: `${tab}# Allowed Values: ${k.o.join(", ")}` });
        if (k.def !== undefined && D.neo) out.push({ x: `${tab}# Default: ${tomlv(k.def, k.ty)}` });
        out.push({ x: `${tab}${k.k} = ${tomlv(val(f, k, origin), k.ty)}`, key: k });
      });
      if (si < D.secs.length - 1) out.push({ x: "" });
    });
    return out;
  }
  function paint(x, fmt) {
    const e = esc(x);
    const valc = (v) => {
      const t = v.trim();
      if (/^-?\d+(\.\d+)?$/.test(t.replace(/,$/, ""))) return `<span class="n">${v}</span>`;
      if (/^(true|false),?$/.test(t)) return `<span class="b">${v}</span>`;
      if (/^&quot;|^"/.test(t)) return `<span class="q">${v}</span>`;
      return v;
    };
    if (fmt === "js") {
      if (/^\s*\/\//.test(x)) return `<span class="c">${e}</span>`;
      return e.replace(/('[^']*')/g, '<span class="q">$1</span>').replace(/\b(ServerEvents|ItemEvents|StartupEvents)\b/g, '<span class="k">$1</span>').replace(/\b(event)\b/g, '<span class="kw">$1</span>');
    }
    if (/^\s*[#;]/.test(x)) return `<span class="c">${e}</span>`;
    if (/^\s*\[[^\]]+\]\s*$/.test(x)) return `<span class="s">${e}</span>`;
    if (fmt === "json") {
      const m = e.match(/^(\s*)(&quot;[^&]*&quot;)(:\s*)(.*)$/);
      return m ? `${m[1]}<span class="k">${m[2]}</span>${m[3]}${valc(m[4])}` : e;
    }
    if (fmt === "options" || fmt === "text") {
      const m = e.match(/^([^:]+)(:)(.*)$/);
      return m ? `<span class="k">${m[1]}</span>${m[2]}${valc(m[3])}` : e;
    }
    const m = e.match(/^(\s*)([^=\s]+)(\s*=\s*)(.*)$/);
    return m ? `${m[1]}<span class="k">${m[2]}</span>${m[3]}${valc(m[4])}` : e;
  }
  function codeBlock(f, origin, opts) {
    const fmt = fmtOf(f);
    const lines = textLines(f, origin);
    return `<div class="code copyable" role="textbox" aria-multiline="true" aria-label="Conteúdo de ${esc(fileName(f))}">${lines.map((l, i) => {
      const isd = l.key ? origin === "test" && keyDiff(f, l.key) : l.diff !== null && l.diff !== undefined;
      const was = l.key ? show$(l.key.v) : l.diff ? l.diff.trim() : "";
      const ghost = isd && !(opts && opts.noGhost) ? `<span class="ghost">   ← no pack: ${esc(was)}</span>` : "";
      return `<div class="code__l ${isd ? "is-diff" : ""}"><span class="code__n">${i + 1}</span><span class="code__g"></span><span class="code__x">${paint(l.x, fmt)}${ghost}</span></div>`;
    }).join("")}</div>`;
  }

  function control(f, k, origin) {
    const v = val(f, k, origin);
    const id = `c-${k.k.replace(/[^\w]/g, "_")}`;
    if (k.ty === "bool") return `<div class="swrow"><button type="button" class="sw" role="switch" aria-checked="${v}" aria-label="${esc(k.l)}" data-k="${k.k}"></button><span>${v ? "Ligado" : "Desligado"}</span></div>`;
    if (k.ty === "enum") return `<label class="sr-only" for="${id}">${esc(k.l)}</label><select id="${id}" class="select" data-k="${k.k}">${k.o.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    if (k.ty === "int" || k.ty === "float") {
      const range = k.r ? (k.r[1] > 1e8 ? `a partir de ${k.r[0]}` : `${String(k.r[0]).replace(".", ",")} a ${String(k.r[1]).replace(".", ",")}`) : "";
      return `<div class="numrow"><label class="sr-only" for="${id}">${esc(k.l)}</label><input id="${id}" class="input" value="${v}" inputmode="decimal" data-k="${k.k}" spellcheck="false">${k.u ? `<span class="unit">${k.u}</span>` : ""}</div>${range ? `<span class="fr__hint">Faixa: ${range}</span>` : ""}`;
    }
    return `<label class="sr-only" for="${id}">${esc(k.l)}</label><input id="${id}" class="input input--text" value="${esc(v)}" data-k="${k.k}" spellcheck="false">`;
  }
  function meta(f, k, origin, opts) {
    const v = val(f, k, origin);
    let h = "";
    if (k.def !== undefined) {
      const chg = v !== k.def;
      h += `<div class="line" title="Do comentário do arquivo (Default:)">padrão: <span class="mono">${show$(k.def)}</span>${chg ? `<span class="chg" title="O valor é diferente do padrão que o arquivo informa">alterado</span><button type="button" class="btn btn--ghost btn--icon btn--sm" data-act="restore" data-k="${k.k}" title="Restaurar padrão de ${k.k}" aria-label="Restaurar padrão de ${k.k}">${ic("undo-2", "icon--sm")}</button>` : ""}</div>`;
    }
    if (opts && opts.noPack) return h;
    if (keyDiff(f, k) && origin === "test") h += `<div class="line"><span class="pk">no pack <b>${show$(k.v)}</b></span><button type="button" class="btn btn--sm" data-act="bring" data-k="${k.k}" title="Grava ${show$(val(f, k, origin))} no pack">Trazer para o pack</button></div>`;
    if (keyDiff(f, k) && origin === "pack") h += `<div class="line"><span class="pk">no teste <b>${show$(k.t)}</b></span></div>`;
    return h;
  }
  function formRows(f, origin) {
    const D = doc(f);
    const n = norm(S.fq.trim());
    let out = "";
    D.secs.forEach((s) => {
      const keys = s.keys.filter((k) => (!S.ffc || (k.def !== undefined && val(f, k, origin) !== k.def)) && (!S.ffd || keyDiff(f, k)) && (!n || norm(k.k + " " + k.l + " " + (k.d || "")).includes(n)));
      if (!keys.length) return;
      out += `<section class="fsec"><div class="fsec__h"><h4>${esc(s.t)}</h4>${s.id ? `<code>[${s.id}]</code>` : ""}</div>${keys.map((k) => `
        <div class="fr ${origin === "test" && keyDiff(f, k) ? "is-diff" : ""} ${S.over[okey(f, origin, k.k)] !== undefined ? "is-edited" : ""}" data-row="${k.k}">
          <div class="fr__l"><span class="fr__t" title="${D.lang ? `Nome que o próprio mod dá a esta opção (${D.lang})` : ""}">${esc(k.l)}</span><span class="fr__k">${esc(k.k)}</span>${k.d ? `<span class="fr__d">${esc(k.d)}</span>` : ""}</div>
          <div class="fr__c">${control(f, k, origin)}</div>
          <div class="fr__m">${meta(f, k, origin)}</div>
        </div>`).join("")}</section>`;
    });
    return out || `<p class="res__empty">Nenhuma chave com esses filtros.</p>`;
  }

  function band(f, origin) {
    const d = diffCount(f);
    if (f.where === "personal") return `<div class="band band--own">${ic("lock")}<span class="band__t"><b>Preferência pessoal.</b> Fica só neste computador, volta igual em todo teste e nunca vai para o pack.</span><span class="band__acts"><button type="button" class="btn btn--sm btn--ghost" data-act="unOwn">Deixar de ser pessoal…</button></span></div>`;
    if (origin === "pack") return `<div class="band band--pack">${ic("users")}<span class="band__t"><b>Config do pack.</b> Vai para os jogadores na próxima versão publicada.${d ? ` O seu teste local tem <b style="color:var(--place-test)">${plural(d, "diferença", "diferenças")}</b>.` : ""}</span>${d ? `<span class="band__acts"><button type="button" class="btn btn--sm" data-act="goTest">${ic("monitor", "icon--sm")}Ver no teste local</button></span>` : ""}</div>`;
    if (f.where === "test") return `<div class="band band--test">${ic("monitor")}<span class="band__t"><b>Só no teste local.</b> O jogo criou este arquivo ao abrir. Os jogadores não recebem.</span><span class="band__acts"><button type="button" class="btn btn--sm" data-act="bringFile">${ic("package", "icon--sm")}Trazer para o pack</button><button type="button" class="btn btn--sm btn--ghost" data-act="mkOwn">${ic("lock", "icon--sm")}Marcar como pessoal</button></span></div>`;
    if (d) return `<div class="band band--test">${ic("monitor")}<span class="band__t"><b>Teste local.</b> ${plural(d, "chave está diferente", "chaves estão diferentes")} do pack. Os jogadores recebem a do pack.</span><span class="band__acts"><button type="button" class="btn btn--sm" data-act="bringAll">${ic("package", "icon--sm")}Trazer ${d === 1 ? "a diferença" : `as ${d}`} para o pack</button><button type="button" class="btn btn--sm btn--ghost" data-act="revertAll">Voltar ao do pack</button></span></div>`;
    return `<div class="band band--test">${ic("monitor")}<span class="band__t"><b>Teste local.</b> Igual ao pack.</span></div>`;
  }

  function tools(f, origin) {
    const can = FORMCAP[fmtOf(f)];
    if (S.mode === "form" && can) {
      const nc = changedCount(f, origin);
      const nd = origin === "test" ? diffCount(f) : 0;
      const D = doc(f);
      return `<div class="edtools">${qbox("fq", "Buscar neste arquivo", S.fq)}
        <div class="fchips">${hasDefaults(f) ? `<button type="button" class="fchip" data-act="ffc" aria-pressed="${S.ffc}">Mudou do padrão <span class="n">${nc}</span></button>` : ""}${nd ? `<button type="button" class="fchip fchip--test" data-act="ffd" aria-pressed="${S.ffd}"><span class="sq"></span>Diferente do pack <span class="n">${nd}</span></button>` : ""}</div>
        </div>`;
    }
    return `<div class="edtools"><button type="button" class="btn btn--sm" data-act="proto" data-msg="Abre buscar e substituir dentro do texto.">${ic("search", "icon--sm")}Buscar e substituir</button><button type="button" class="btn btn--sm btn--ghost" data-act="proto" data-msg="Desfaz a última edição (Ctrl+Z).">${ic("undo-2", "icon--sm")}Desfazer</button><span class="edtools__sp"></span><span class="fine">${can ? "Comentários e formatação são preservados" : fmtOf(f) === "js" ? "Script do KubeJS: abre sempre como texto" : "Este arquivo só pode ser editado como texto"}</span></div>`;
  }

  function scrollContent(f, origin) {
    const can = FORMCAP[fmtOf(f)];
    let h = "";
    if (fmtOf(f) === "js") h += `<div class="scriptbar"><span class="tag">KubeJS 7 · NeoForge 1.21.1</span><button type="button" class="btn btn--sm" data-act="proto" data-msg="Lista os trechos prontos de receitas, tags e itens desta versão do KubeJS.">Trechos prontos${ic("chevron-down", "icon--sm")}</button><button type="button" class="btn btn--sm btn--ghost" data-act="proto" data-msg="Mostra os erros que o KubeJS registrou no último teste.">Erros dos scripts <span class="count count--warn" style="margin-left:4px">0</span></button><button type="button" class="btn btn--sm btn--ghost" aria-disabled="true" title="Abra o jogo pelo Testar para recarregar os scripts.">Recarregar no jogo</button></div>`;
    else if (!can) h += `<div class="scriptbar"><span class="t3">${ic("info", "icon--sm")}</span><span>O formulário funciona com TOML, JSON, JSON5, .properties, .cfg do Forge e options.txt. Este é ${FMT_NAME[fmtOf(f)]}.</span></div>`;
    if (S.mode === "form" && can) h += formRows(f, origin);
    else h += codeBlock(f, origin);
    return h;
  }

  function editor(f, origin, opts) {
    opts = opts || {};
    if (!inOrigin(f, origin)) {
      const own = f.where === "personal";
      return `<main class="ed" aria-label="Editor">
        <div class="edhead"><div class="edhead__t"><span class="edhead__name">${esc(nameOf(f))}</span><span class="edhead__path">${f.p}</span></div>${opts.close ? `<button type="button" class="btn btn--sm btn--ghost" data-act="close2">${ic("x", "icon--sm")}Fechar</button>` : ""}</div>
        <div class="ed__scroll"><div class="edempty">
          <h3>${own ? "Esta config não vai para o pack" : "Esta config só existe no teste"}</h3>
          <p>${own ? `<span class="mono">${f.p}</span> é uma preferência pessoal: fica só neste computador e volta igual em todo teste.` : `O jogo criou <span class="mono">${f.p}</span> na instância de teste. Ele não está no pack, então os jogadores não recebem.`}</p>
          <div class="acts"><button type="button" class="btn btn--sm" data-act="goTest">${ic("monitor", "icon--sm")}Ver no teste local</button>${own ? "" : `<button type="button" class="btn btn--sm" data-act="bringFile">${ic("package", "icon--sm")}Trazer para o pack</button>`}</div>
        </div></div></main>`;
    }
    const dirty = dirtyCount(f, origin);
    const head = opts.noHead ? "" : `<div class="edhead">
        <div class="edhead__t"><span class="edhead__name">${esc(nameOf(f))}</span><span class="edhead__path" title="${f.p}">${f.p}</span></div>
        ${modeSeg(f)}
        ${opts.det ? `<button type="button" class="btn btn--sm det-toggle" data-act="det" aria-expanded="${S.det}">${ic("panel-right", "icon--sm")}Detalhes</button>` : ""}
        <button type="button" class="btn btn--sm btn--icon btn--ghost" data-act="proto" data-msg="Mais ações: restaurar o arquivo todo para o padrão, marcar como pessoal, abrir a pasta." aria-label="Mais ações do arquivo">${ic("ellipsis", "icon--sm")}</button>
        ${saveBtn(dirty)}
        ${opts.close ? `<button type="button" class="btn btn--sm btn--ghost btn--icon" data-act="close2" aria-label="Fechar o arquivo e voltar à lista" title="Fechar e voltar à lista">${ic("x", "icon--sm")}</button>` : ""}
      </div>`;
    return `<main class="ed" aria-label="Editor">${head}
      ${opts.meta ? metaStrip(f, origin) : ""}
      ${band(f, origin)}
      ${opts.wide ? "" : tools(f, origin)}
      <div class="ed__scroll" id="edScroll"><div class="ed__in ${opts.wide ? "wrap3" : ""}">${opts.wide ? tools(f, origin).replace('class="edtools"', 'class="edtools edtools--in"') : ""}<div id="edBody">${scrollContent(f, origin)}</div></div></div>
      <div class="edfoot"><span>${FMT_NAME[fmtOf(f)]}${doc(f) && doc(f).neo ? " do NeoForge" : ""} · UTF-8 · ${fmtOf(f) === "options" ? "LF" : "CRLF"} · ${f.size}${S.mode === "form" && FORMCAP[fmtOf(f)] ? ` · ${hasDefaults(f) ? "padrões lidos do próprio arquivo" : "o arquivo não informa padrões"}${doc(f).lang ? ` · rótulos do ${doc(f).lang}` : ""}` : ""}</span><span class="edfoot__end ${dirty ? "dirty" : ""}">${dirty ? `${plural(dirty, "alteração não salva", "alterações não salvas")} · Ctrl+S salva` : "Sem alterações"}</span></div>
    </main>`;
  }
  const saveBtn = (dirty) => `<button type="button" class="btn btn--sm ${dirty ? "btn--primary" : ""} savebtn" data-act="save" ${dirty ? "" : 'aria-disabled="true" title="Nada para salvar ainda."'}>${ic("save", "icon--sm")}Salvar${dirty ? `<span class="n">${dirty}</span>` : ""}</button>`;
  function metaStrip(f, origin) {
    const nc = changedCount(f, origin);
    return `<div class="meta2"><span><b>${esc(MODS[f.mod].n)}</b> ${MODS[f.mod].v}</span><span>${FMT_NAME[fmtOf(f)]}</span><span>Alterado ${f.when}</span>${hasDefaults(f) ? `<span>${plural(nc, "chave mudou", "chaves mudaram")} do padrão</span>` : ""}</div>`;
  }

  /* Detalhes (opção 1) */
  function details(f, origin) {
    const d = diffCount(f);
    const nc = changedCount(f, origin);
    const D = doc(f);
    const places = f.where === "personal"
      ? `<li class="place place--off">${ic("users")}<span class="place__t">Pack</span><span class="place__d">Nunca vai. Os jogadores usam as próprias preferências.</span></li>
         <li class="place place--own">${ic("lock")}<span class="place__t">Este computador</span><span class="place__d">Guardado pelo Warden e copiado para a instância em todo teste.</span></li>`
      : f.where === "test"
        ? `<li class="place place--off">${ic("users")}<span class="place__t">Pack</span><span class="place__d">Não está. Os jogadores não recebem.</span></li>
           <li class="place place--test">${ic("monitor")}<span class="place__t">Teste local</span><span class="place__d">Criado pelo jogo, ${f.when}.</span></li>`
        : `<li class="place place--pack">${ic("users")}<span class="place__t">Pack</span><span class="place__d">Os jogadores recebem esta versão.</span></li>
           <li class="place place--test">${ic("monitor")}<span class="place__t">Teste local</span><span class="place__d">${d ? `<span style="color:var(--place-test)">${plural(d, "diferença", "diferenças")} do pack</span>` : "Igual ao pack."}</span></li>`;
    const diffs = f.where === "both" && d && !isRaw(f) ? `<section class="dsec"><h3>${origin === "pack" ? "Diferente no teste local" : "Diferenças com o pack"}</h3><ul class="dlist">${allKeys(f).filter((k) => keyDiff(f, k)).map((k) => `<li><span>${esc(k.l)}</span><span class="vv"><span class="a" title="no pack">${show$(k.v)}</span> → <span class="b" title="no teste local">${show$(k.t)}</span></span><span class="k">${k.k}</span></li>`).join("")}</ul>
      <div class="acts"><button type="button" class="btn btn--sm btn--primary" data-act="bringAll">${ic("package", "icon--sm")}Trazer para o pack</button><button type="button" class="btn btn--sm btn--ghost" data-act="revertAll">Voltar ao do pack</button></div></section>` : "";
    const notes = [];
    if (D && D.neo) notes.push("O jogo pode reescrever este arquivo e apagar comentários que você adicionar.", "Valores fora da faixa voltam ao padrão e chaves que o mod não conhece são apagadas quando o jogo abre.");
    if (D && D.server) notes.unshift("Está em defaultconfigs/: vale para mundos novos.");
    if (D && D.note) notes.unshift(D.note);
    return `<aside class="det" aria-labelledby="detT"><div class="colhead"><h2 id="detT">Detalhes</h2>${false ? `<button type="button" class="btn btn--sm btn--ghost btn--icon" data-act="det" aria-label="Fechar detalhes">${ic("x", "icon--sm")}</button>` : ""}</div>
      <div class="det__body">
        <section class="dsec"><h3>Arquivo</h3><dl class="kv">
          <dt>Mod</dt><dd>${esc(MODS[f.mod].n)} <span class="mono t3">${MODS[f.mod].v}</span></dd>
          <dt>Formato</dt><dd>${FMT_NAME[fmtOf(f)]}${D && D.neo ? " do NeoForge" : ""}</dd>
          <dt>Tamanho</dt><dd class="mono">${f.size}</dd>
          <dt>Alterado</dt><dd>${f.when}</dd>
          ${hasDefaults(f) ? `<dt>Padrão</dt><dd>${plural(nc, "chave mudou", "chaves mudaram")}</dd>` : ""}
        </dl></section>
        <section class="dsec"><h3>Onde está</h3><ul class="places">${places}</ul></section>
        ${diffs}
        ${notes.length ? `<section class="dsec"><h3>Avisos</h3><div class="notices">${notes.map((n) => `<div class="alert alert--neutral">${ic("info")}<span>${n}</span></div>`).join("")}</div></section>` : ""}
        <section class="dsec"><h3>Mais ações</h3><div class="actlist">
          ${f.where === "personal" ? `<button type="button" class="btn btn--sm btn--ghost" data-act="unOwn">${ic("lock", "icon--sm")}Deixar de ser pessoal…</button>` : `<button type="button" class="btn btn--sm btn--ghost" data-act="mkOwn">${ic("lock", "icon--sm")}Marcar como pessoal</button>`}
          ${hasDefaults(f) ? `<button type="button" class="btn btn--sm btn--ghost" data-act="proto" data-msg="Mostra a diferença antes de gravar.">${ic("rotate-ccw", "icon--sm")}Restaurar o arquivo todo para o padrão…</button>` : ""}
          <button type="button" class="btn btn--sm btn--ghost" data-act="proto" data-msg="Abre a pasta no Explorador de Arquivos.">${ic("folder-open", "icon--sm")}Abrir a pasta</button>
        </div></section>
      </div></aside>`;
  }

  /* =================== Rail =================== */
  const rail = () => {
    const items = [["puzzle", "Mods"], ["file-code", "Configs", true], ["triangle-alert", "Problemas", false, true], ["sparkles", "Sensor Sculk"], ["history", "Histórico"], ["package", "Exportar"]];
    return `<nav class="rail" aria-label="Seções do pack">${items.map(([i, t, cur, dot]) => `<a href="#" title="${t}" ${cur ? 'aria-current="page"' : ""}>${ic(i)}${dot ? '<span class="rail__dot" aria-hidden="true"></span>' : ""}<span class="sr-only">${t}</span></a>`).join("")}</nav>`;
  };

  /* =================== Opção 1: três colunas =================== */
  function nav1() {
    const origin = S.origin;
    return `<aside class="nav" aria-labelledby="navT">
      <div class="colhead"><h2 id="navT">Configs</h2><button type="button" class="btn btn--sm btn--ghost btn--icon" data-act="proto" data-msg="Relê os arquivos do disco." aria-label="Reler os arquivos">${ic("rotate-ccw", "icon--sm")}</button></div>
      <div class="nav__top">
        <div class="origin">${originSeg(false)}${originCap()}</div>
        ${qbox("q", "Buscar nas configs", S.q, "Ctrl+Shift+F")}
        ${filterChips(origin, true)}
      </div>
      <div class="nav__list" id="navList">${S.q.trim() ? results(origin) : tree(origin)}</div>
      ${origin === "pack" ? `<div class="nav__foot">${ic("lock", "icon--sm")}<span>options.txt e o minimapa são preferências pessoais: ficam só neste computador.</span></div>` : ""}
    </aside>`;
  }
  const body1 = () => {
    const f = byPath(S.file);
    return `<div class="body body--c3 ${S.det ? "" : "no-det"}">${rail()}${nav1()}${editor(f, S.origin, { det: true })}${S.det ? details(f, S.origin) : ""}</div>`;
  };

  /* =================== Opção 2: lista larga =================== */
  function rowsFor(list, origin) {
    return list.sort((a, b) => (MODS[a.mod].n + a.p).localeCompare(MODS[b.mod].n + b.p)).map((f) => {
      const d = diffCount(f);
      const nc = changedCount(f, origin);
      let st;
      if (f.where === "personal") st = `<span class="tag">${ic("lock")}Só neste PC</span>`;
      else if (f.where === "test") st = `<span class="tag">Fora do pack</span>`;
      else if (d) st = `<span class="tag tag--test">${origin === "test" ? plural(d, "diferença", "diferenças") + " do pack" : "Diferente no teste"}</span>`;
      else st = `<span class="quiet">${origin === "test" ? "Igual ao pack" : "Igual no teste"}</span>`;
      const hits = S.q.trim() ? (search(S.q, origin).find((r) => r.f === f) || { hits: [] }).hits.slice(0, 2) : [];
      return `<button type="button" class="trow" role="row" aria-selected="${S.open2 && S.file === f.p}" data-file="${f.p}">
        <span class="trow__mod">${esc(f.label ? `${f.label}` : MODS[f.mod].n)}</span>
        <span class="trow__path" title="${f.p}">${S.q.trim() ? hl(f.p, S.q) : f.p}</span>
        <span class="trow__st">${st}</span>
        <span class="trow__n r">${hasDefaults(f) ? (nc ? `${nc}` : `<span class="quiet">nenhuma</span>`) : `<span class="quiet">—</span>`}</span>
        <span class="trow__w r">${f.when}</span>
        ${hits.length && !S.open2 ? `<span class="trow__hits">${hits.map((h) => h.k ? `<span><span class="mono">${hl(h.k.k, S.q)} = ${hl(h.v, S.q)}</span> · ${hl(h.k.l, S.q)}</span>` : `<span class="mono">${hl(h.line, S.q)}</span>`).join("")}</span>` : ""}
      </button>`;
    }).join("");
  }
  function table2() {
    const origin = S.origin;
    const q = S.q.trim();
    const match = (f) => !q || search(S.q, origin).some((r) => r.f === f);
    const base = filtered(origin).filter(match);
    const both = base.filter((f) => f.where === "both");
    const test = base.filter((f) => f.where === "test");
    const own = origin === "test" ? personal().filter(match).filter((f) => !S.fChanged && !S.fDiff) : [];
    let h = `<div class="tbl__head" role="row"><span>Mod</span><span>Arquivo</span><span>Situação</span><span class="r">Mudou do padrão</span><span class="r">Alterado em</span></div>`;
    if (both.length) h += `<div class="tsec tsec--pack"><h3>${ic("users")}No pack · ${both.length}</h3><p>Vão para os jogadores na próxima versão publicada.</p></div>${rowsFor(both, origin)}`;
    if (origin === "test" && test.length) h += `<div class="tsec tsec--test"><h3>${ic("monitor")}Só no teste · ${test.length}</h3><p>O jogo criou ao abrir. Ficam só neste computador até você trazer para o pack.</p></div>${rowsFor(test, origin)}`;
    if (own.length) h += `<div class="tsec tsec--own"><h3>${ic("lock")}Preferências pessoais · ${own.length}</h3><p>Só suas. Voltam iguais em todo teste e nunca vão para o pack.</p></div>${rowsFor(own, origin)}`;
    if (origin === "pack") h += `<div class="hintbox" style="margin:var(--space-5) var(--space-6)"><span><strong>${FILES.filter((f) => f.where === "test").length} configs estão só no teste e ${personal().length} são pessoais.</strong> Não aparecem aqui porque não vão para os jogadores.</span><button type="button" class="btn btn--sm" data-act="goTest">${ic("monitor", "icon--sm")}Ver no teste local</button></div>`;
    if (!both.length && !test.length && !own.length) h += `<p class="res__empty" style="padding:var(--space-6)">Nada encontrado${q ? ` para “${esc(q)}”` : " com esses filtros"}.</p>`;
    return h;
  }
  const body2 = () => {
    const origin = S.origin;
    const total = FILES.filter((f) => inOrigin(f, origin)).length;
    const mods = new Set(FILES.filter((f) => inOrigin(f, origin)).map((f) => f.mod)).size;
    const f = byPath(S.file);
    return `<div class="body body--full">${rail()}
      <main class="pg">
        <div class="pghead"><div class="pghead__t"><h2>Configs</h2><p>Arquivos de ajuste e scripts do pack</p></div><div class="origin">${originSeg(false)}${originCap()}</div></div>
        <div class="tb">${qbox("q", "Buscar nos nomes e no conteúdo das configs", S.q, "Ctrl+Shift+F")}${filterChips(origin)}
          <label class="sr-only" for="modSel">Filtrar por mod</label><select id="modSel" class="select"><option value="">Todos os mods</option>${[...new Set(FILES.map((x) => x.mod))].filter((m) => m !== "game").sort((a, b) => MODS[a].n.localeCompare(MODS[b].n)).map((m) => `<option value="${m}" ${S.mod === m ? "selected" : ""}>${MODS[m].n}</option>`).join("")}</select>
          <span class="tb__sum">${total} arquivos · ${mods} mods</span></div>
        <div class="l2 ${S.open2 ? "is-open" : ""}">
          <div class="tbl" role="grid" aria-label="Arquivos de config" id="tblBody">${table2()}</div>
          ${S.open2 ? editor(f, origin, { close: true, meta: true }) : ""}
        </div>
      </main></div>`;
  };

  /* =================== Opção 3: editor amplo =================== */
  function nav3() {
    const origin = viewOrigin();
    const list = filtered(origin);
    const groups = {};
    list.forEach((f) => { (groups[f.mod] = groups[f.mod] || []).push(f); });
    let h = "";
    if (S.q.trim()) h = results(origin);
    else {
      Object.keys(groups).sort((a, b) => MODS[a].n.localeCompare(MODS[b].n)).forEach((m) => {
        h += `<div class="navmod">${esc(MODS[m].n)}<span class="n">${groups[m].length}</span></div>`;
        h += groups[m].map((f) => `<button type="button" class="tnode tnode--file" aria-selected="${S.file === f.p}" data-file="${f.p}" title="${f.p}" style="--lvl:0"><span></span>${ic(fmtOf(f) === "js" ? "file-code" : "file")}<span class="tnode__name">${f.p.replace(/^config\//, "")}</span><span class="tnode__end">${mark(f, origin)}</span></button>`).join("");
      });
      if (origin === "test") h += `<div class="tgroup">${ic("lock")}Só neste computador<span class="n">${personal().length}</span></div>` + personal().map((f) => `<button type="button" class="tnode tnode--file tnode--friendly" aria-selected="${S.file === f.p}" data-file="${f.p}" style="--lvl:0"><span></span>${ic(f.p === "options.txt" ? "gamepad" : "file")}<span class="tnode__name">${f.label}<span class="sub">${fileName(f)}</span></span><span class="tnode__end">${mark(f, origin)}</span></button>`).join("");
    }
    return `<aside class="nav" aria-label="Arquivos de config">
      <div class="nav__top">${qbox("q", "Buscar nas configs", S.q)}${filterChips(origin, true)}</div>
      <div class="nav__list" id="navList">${h}</div></aside>`;
  }
  function compare(f) {
    const d = diffCount(f);
    if (isRaw(f)) {
      return `<div class="cmpsum"><span class="cmpsum__t"><b>${plural(d, "linha diferente", "linhas diferentes")}</b> entre o seu teste local e o pack.</span></div>
        <div class="cmphead" style="grid-template-columns:1fr 1fr"><div class="test"><span class="t">${ic("monitor")}Teste local</span><span class="s">só neste computador</span></div><div class="pack"><span class="t">${ic("users")}Pack</span><span class="s">o que os jogadores recebem</span></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)">${codeBlock(f, "test", { noGhost: true })}${codeBlock(f, "pack")}</div>`;
    }
    const D = doc(f);
    let rows = "";
    D.secs.forEach((s) => {
      const keys = s.keys.filter((k) => !S.ffd || keyDiff(f, k));
      if (!keys.length) return;
      rows += `<div class="fsec__h"><h4>${esc(s.t)}</h4>${s.id ? `<code>[${s.id}]</code>` : ""}</div>` + keys.map((k) => {
        const dif = keyDiff(f, k);
        return `<div class="cr ${dif ? "is-diff" : "is-same"}" data-row="${k.k}" style="${dif ? "" : ""}">
          <div class="fr__l"><span class="fr__t">${esc(k.l)}</span><span class="fr__k">${esc(k.k)}</span>${k.d ? `<span class="fr__d">${esc(k.d)}</span>` : ""}</div>
          <div class="fr__c">${control(f, k, "test")}</div>
          <div class="cr__mid">${dif ? `<button type="button" class="btn btn--sm" data-act="bring" data-k="${k.k}" title="Trazer ${show$(k.t)} para o pack" aria-label="Trazer para o pack">${ic("arrow-right", "icon--sm")}</button><button type="button" class="btn btn--sm btn--ghost" data-act="revert" data-k="${k.k}" title="Voltar ao do pack (${show$(k.v)})" aria-label="Voltar ao do pack">${ic("arrow-left", "icon--sm")}</button>` : `<span class="eq">igual</span>`}</div>
          <div class="cr__pack"><span>${show$(k.v)}${k.u ? ` <small>${k.u}</small>` : ""}</span>${k.def !== undefined ? `<small>padrão: ${show$(k.def)}${k.v !== k.def ? " · alterado" : ""}</small>` : ""}</div>
        </div>`;
      }).join("");
    });
    return `<div class="cmpsum"><span class="cmpsum__t">${d ? `<b>${plural(d, "diferença", "diferenças")}</b> entre o seu teste local e o pack. À direita, o que os jogadores recebem; a seta → traz o valor do teste para o pack.` : "<b>Igual ao pack.</b> Nada para trazer."}</span>
        ${d ? `<button type="button" class="fchip fchip--test" data-act="ffd" aria-pressed="${S.ffd}"><span class="sq"></span>Só as diferenças <span class="n">${d}</span></button><button type="button" class="btn btn--sm btn--primary" data-act="bringAll">${ic("package", "icon--sm")}Trazer ${d === 1 ? "a diferença" : `as ${d}`} para o pack</button><button type="button" class="btn btn--sm btn--ghost" data-act="revertAll">Voltar ao do pack</button>` : ""}</div>
      <div class="cmphead"><div>Opção</div><div class="test"><span class="t">${ic("monitor")}Teste local</span><span class="s">só neste computador</span></div><div></div><div class="pack"><span class="t">${ic("users")}Pack</span><span class="s">o que os jogadores recebem</span></div></div>
      ${rows}`;
  }
  const body3 = () => {
    const f = byPath(S.file);
    const origin = viewOrigin();
    const cmpOk = S.cmp && f.where === "both";
    const dirty = dirtyCount(f, origin);
    let main;
    if (!inOrigin(f, origin)) main = editor(f, origin, { noHead: true });
    else if (cmpOk && !(S.mode === "text" && !isRaw(f) && false)) {
      main = `<main class="ed" aria-label="Comparar">${S.mode === "text" && !isRaw(f)
        ? `<div class="ed__scroll" id="edScroll"><div class="ed__in wrap3"><div class="cmpsum"><span class="cmpsum__t"><b>${plural(diffCount(f), "linha diferente", "linhas diferentes")}</b> entre o teste local e o pack.</span></div><div class="cmphead" style="grid-template-columns:1fr 1fr"><div class="test"><span class="t">${ic("monitor")}Teste local</span><span class="s">só neste computador</span></div><div class="pack"><span class="t">${ic("users")}Pack</span><span class="s">o que os jogadores recebem</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)">${codeBlock(f, "test", { noGhost: true })}${codeBlock(f, "pack")}</div></div></div>`
        : `<div class="ed__scroll" id="edScroll"><div class="ed__in wrap3">${compare(f)}</div></div>`}
        <div class="edfoot"><span>${FMT_NAME[fmtOf(f)]}${doc(f) && doc(f).neo ? " do NeoForge" : ""} · UTF-8 · ${f.size}</span><span class="edfoot__end ${dirty ? "dirty" : ""}">${dirty ? `${plural(dirty, "alteração não salva", "alterações não salvas")} · Ctrl+S salva` : "Sem alterações"}</span></div></main>`;
    } else main = editor(f, origin, { noHead: true, wide: true });
    return `<div class="body body--full">${rail()}
      <section class="pg" aria-label="Configs">
        <div class="xbar">
          <button type="button" class="btn btn--sm btn--ghost btn--icon" data-act="nav3" aria-pressed="${S.nav3}" aria-label="${S.nav3 ? "Esconder" : "Mostrar"} a lista de arquivos" title="Lista de arquivos (Ctrl+B)">${ic("panel-left")}</button>
          <button type="button" class="crumb" data-act="qo" title="Ir para outro arquivo (Ctrl+P)"><span class="crumb__name">${esc(nameOf(f))}</span><span class="crumb__path">${f.p}</span>${ic("chevron-down", "icon--sm")}</button>
          <span class="xbar__sp"></span>
          ${originSeg(true)}
          ${modeSeg(f, true)}
          ${saveBtn(dirty)}
        </div>
        ${S.cmp && f.where !== "both" ? `<div class="band band--own">${ic("info")}<span class="band__t">Comparar só vale para configs que estão no pack e no teste. Mostrando o teste local.</span></div>` : ""}
        <div class="l3 ${S.nav3 ? "is-nav" : ""}">${nav3()}${main}</div>
      </section></div>`;
  };

  /* Ir para arquivo (Ctrl+P) */
  function qoList() {
    const n = norm(S.qoq.trim());
    const recent = ["config/DistantHorizons.toml", "kubejs/server_scripts/receitas.js", "options.txt", "config/jei/jei-client.ini"].map(byPath);
    const list = n ? FILES.filter((f) => norm(f.p + " " + nameOf(f)).includes(n)) : recent;
    const tag = (f) => (f.where === "personal" ? `<span class="tag">${ic("lock")}Só neste PC</span>` : f.where === "test" ? `<span class="tag">Fora do pack</span>` : `<span class="tag tag--pack">No pack</span>`);
    return (n ? "" : `<div class="tgroup" style="padding-top:var(--space-2)">Abertos há pouco</div>`) + (list.length ? list.slice(0, 9).map((f, i) => `<button type="button" class="qo__item ${i === 0 ? "is-hot" : ""}" data-file="${f.p}">${ic(fmtOf(f) === "js" ? "file-code" : "file")}<span><span class="m">${esc(nameOf(f))}</span><span class="p">${n ? hl(f.p, S.qoq) : f.p}</span></span>${tag(f)}</button>`).join("") : `<p class="res__empty">Nenhum arquivo com “${esc(S.qoq)}”.</p>`);
  }
  function renderQo() {
    $("#qoHost").innerHTML = S.qo ? `<div class="qo" data-act="qoClose"><div class="qo__box" role="dialog" aria-label="Ir para arquivo">
      <div class="qo__in">${qbox("qoIn", "Ir para o arquivo: digite parte do nome ou do mod", S.qoq)}</div>
      <div class="qo__list" id="qoList">${qoList()}</div>
      <div class="qo__foot"><span><kbd>Enter</kbd> abre</span><span><kbd>Esc</kbd> fecha</span><span>Mostra pack, teste local e preferências pessoais</span></div></div></div>` : "";
    if (S.qo) { const i = $("#qoIn"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }

  /* =================== Opções e render =================== */
  const SK = {
    1: { name: "Três colunas", txt: `<p>O jeito clássico de app de desktop, igual ao Sensor Sculk aprovado: <strong>arquivos à esquerda</strong>, <strong>editor no meio</strong> usando toda a altura e <strong>detalhes à direita</strong> (de qual mod é, onde o arquivo está e o que difere do pack).</p>
        <p>No topo da coluna fica o seletor <strong>Do pack | Do teste local</strong>. Uma busca só, para nomes e conteúdo, e os filtros viram botões do mesmo tamanho. As preferências pessoais ficam num grupo à parte, com cadeado.</p>`,
      pro: "tudo à vista ao mesmo tempo; mesmo padrão da tela que você aprovou", con: "três colunas dividem a largura; o editor fica mais estreito que nas outras opções", html: body1 },
    2: { name: "Lista larga", txt: `<p>A seção abre numa <strong>tabela larga com todas as configs</strong>, separada em <strong>No pack</strong>, <strong>Só no teste</strong> e <strong>Preferências pessoais</strong>, com a situação de cada arquivo (igual ao pack, diferente, fora do pack).</p>
        <p>Clicar num arquivo abre o editor ao lado e a tabela vira uma lista estreita. <strong>Fechar</strong> volta para a visão geral.</p>`,
      pro: "bate o olho e vê o que vai para os jogadores e o que ficou só no teste", con: "um clique a mais para editar; a visão geral encolhe enquanto você edita", html: body2 },
    3: { name: "Editor amplo", txt: `<p>O <strong>editor ocupa a janela toda</strong>. A lista de arquivos fica recolhida: abre pelo botão ao lado do nome ou por <strong>Ctrl+P</strong> (ir para arquivo).</p>
        <p>O seletor ganha uma terceira posição, <strong>Comparar</strong>, que põe o teste local e o pack lado a lado, com uma seta em cada valor diferente para trazê-lo ao pack.</p>`,
      pro: "o máximo de espaço para editar e a comparação mais clara", con: "a lista de arquivos fica escondida; sem o Ctrl+P, é um clique a mais", html: body3 },
  };
  function render() {
    const scroll = $("#edScroll") ? $("#edScroll").scrollTop : 0;
    const keep = render.keepScroll;
    $("#body").outerHTML = SK[S.sk].html().replace('<div class="body', '<div id="body" class="body');
    $("#saveCount").textContent = `${S.saved} alterações`;
    if (keep && $("#edScroll")) $("#edScroll").scrollTop = scroll;
    render.keepScroll = false;
    if (S.flash) {
      const row = $(`[data-row="${CSS.escape(S.flash)}"]`);
      if (row) { row.scrollIntoView({ block: "center" }); row.classList.add("is-flash"); }
      S.flash = null;
    }
    renderQo();
  }
  function show(n, keepState) {
    S.sk = String(n);
    if (!keepState) {
      Object.assign(S, { origin: "test", cmp: n == 3, mode: "form", file: "config/DistantHorizons.toml", q: "", fq: "", fChanged: false, fDiff: false, ffc: false, ffd: false, open2: n == 2 ? false : S.open2, nav3: false, det: true, mod: "" });
      if (n == 2) S.open2 = false;
    }
    const s = SK[S.sk];
    $("#skName").textContent = `${S.sk} · ${s.name}`;
    $("#skTxt").innerHTML = s.txt + `<div class="skbar__pc"><span class="pro"><b>Bom:</b> ${s.pro}</span><span class="con"><b>Custa:</b> ${s.con}</span></div>`;
    $$("#skSel button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.n === S.sk)));
    try { localStorage.setItem("skcfg", S.sk); } catch (e) {}
    render();
  }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast toast--ok";
    t.innerHTML = `${ic("circle-check")}<span>${msg}</span><span></span>`;
    $("#toasts").appendChild(t);
    setTimeout(() => t.remove(), 3600);
  }

  /* =================== Ações =================== */
  function setVal(k, v) {
    const f = byPath(S.file);
    const origin = viewOrigin();
    const key = allKeys(f).find((x) => x.k === k);
    const base = origin === "pack" ? key.v : key.t !== undefined ? key.t : key.v;
    if (v === base) delete S.over[okey(f, origin, k)]; else S.over[okey(f, origin, k)] = v;
    render.keepScroll = true;
    render();
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href='#']");
    if (a) e.preventDefault();
    const sk = e.target.closest("#skSel button[data-n]");
    if (sk) return show(sk.dataset.n);
    const t = e.target.closest("[data-origin],[data-mode],[data-dir],[data-file],[data-act],.sw");
    if (!t) return;
    const f = byPath(S.file);
    if (t.dataset.origin) {
      if (t.dataset.origin === "cmp") S.cmp = true; else { S.cmp = false; S.origin = t.dataset.origin; }
      S.ffd = false; S.fDiff = S.origin === "test" ? S.fDiff : false;
      return render();
    }
    if (t.dataset.mode) { if (t.getAttribute("aria-disabled") === "true") return toast("Este arquivo só pode ser editado como texto."); S.mode = t.dataset.mode; return render(); }
    if (t.dataset.dir) { if (S.open.has(t.dataset.dir)) S.open.delete(t.dataset.dir); else S.open.add(t.dataset.dir); return render(); }
    if (t.dataset.file && !t.dataset.act) {
      S.file = t.dataset.file; S.fq = ""; S.ffc = false; S.ffd = false; S.qo = false; S.qoq = "";
      if (S.sk === "2") S.open2 = true;
      if (t.dataset.key) { S.flash = t.dataset.key; S.mode = "form"; }
      return render();
    }
    if (t.classList.contains("sw")) return setVal(t.dataset.k, t.getAttribute("aria-checked") !== "true");
    const act = t.dataset.act;
    const origin = viewOrigin();
    const key = t.dataset.k ? allKeys(f).find((x) => x.k === t.dataset.k) : null;
    switch (act) {
      case "fchg": S.fChanged = !S.fChanged; return render();
      case "fdiff": S.fDiff = !S.fDiff; return render();
      case "ffc": S.ffc = !S.ffc; render.keepScroll = true; return render();
      case "ffd": S.ffd = !S.ffd; return render();
      case "det": S.det = !S.det; return render();
      case "close2": S.open2 = false; return render();
      case "nav3": S.nav3 = !S.nav3; return render();
      case "qo": S.qo = true; return renderQo();
      case "qoClose": if (e.target === t) { S.qo = false; renderQo(); } return;
      case "goTest": S.origin = "test"; S.cmp = false; return render();
      case "restore": return setVal(key.k, key.def);
      case "bring": {
        key.v = val(f, key, "test"); delete key.t; delete S.over[okey(f, "test", key.k)];
        S.saved += 1; render.keepScroll = true; render();
        return toast(`${key.k} trazida para o pack. Aparece em Alterações não salvas.`);
      }
      case "revert": { delete key.t; render.keepScroll = true; render(); return toast(`O teste local voltou a usar ${show$(key.v)} em ${key.k}.`); }
      case "bringAll": {
        if (isRaw(f)) { const R = raw(f); const L = R.v.split("\n"); Object.entries(R.t).forEach(([i, x]) => { L[i] = x; }); R.v = L.join("\n"); delete R.t; }
        allKeys(f).filter((k) => keyDiff(f, k)).forEach((k) => { k.v = k.t; delete k.t; });
        S.saved += 1; render.keepScroll = true; render();
        return toast(`${fileName(f)}: o pack agora tem os valores do teste. Aparece em Alterações não salvas.`);
      }
      case "revertAll": { if (raw(f)) delete raw(f).t; allKeys(f).forEach((k) => { delete k.t; }); render(); return toast(`${fileName(f)}: o teste local voltou a ser igual ao pack.`); }
      case "bringFile": { f.where = "both"; S.saved += 1; S.origin = S.origin; render(); return toast(`${fileName(f)} trazido para o pack. Os jogadores recebem na próxima versão publicada.`); }
      case "mkOwn": { f.where = "personal"; f.label = f.label || MODS[f.mod].n; f.sub = fileName(f); S.origin = "test"; S.cmp = false; render(); return toast(`${fileName(f)} agora é preferência pessoal: fica só neste computador e sai do pack.`); }
      case "unOwn": return toast("No app, pergunta antes: o arquivo volta a poder ir para o pack.");
      case "save": {
        if (t.getAttribute("aria-disabled") === "true") return toast("Nada para salvar ainda.");
        allKeys(f).forEach((k) => {
          const o = S.over[okey(f, origin, k.k)];
          if (o === undefined) return;
          if (origin === "pack" || f.where !== "both") k.v = o; else { k.t = o; if (k.t === k.v) delete k.t; }
          delete S.over[okey(f, origin, k.k)];
        });
        if (origin === "pack") S.saved += 1;
        render.keepScroll = true; render();
        return toast(`${fileName(f)} salvo${origin === "pack" ? " no pack" : " no teste local"}.`);
      }
      case "proto": case "test": case "test-menu": return toast(t.dataset.msg || "Testar abre a tela do teste. Fora deste esboço.");
      default: return undefined;
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "modSel") { S.mod = t.value; return render(); }
    if (t.dataset && t.dataset.k) {
      const f = byPath(S.file);
      const key = allKeys(f).find((x) => x.k === t.dataset.k);
      let v = t.value;
      if (key.ty === "int") v = parseInt(v, 10);
      if (key.ty === "float") v = parseFloat(String(v).replace(",", "."));
      if (Number.isNaN(v)) return;
      setVal(key.k, v);
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "q") {
      S.q = t.value;
      if (S.sk === "2") { $("#tblBody").innerHTML = table2(); hydrate($("#tblBody")); }
      else {
        if (S.sk === "3" && !S.nav3) { S.nav3 = true; render(); const i = $("#q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); return; }
        const list = $("#navList");
        list.innerHTML = S.q.trim() ? results(viewOrigin()) : S.sk === "1" ? tree(viewOrigin()) : nav3().match(/<div class="nav__list" id="navList">([\s\S]*)<\/div><\/aside>/)[1];
      }
    }
    if (t.id === "fq") { S.fq = t.value; const f = byPath(S.file); $("#edBody").innerHTML = scrollContent(f, viewOrigin()); }
    if (t.id === "qoIn") { S.qoq = t.value; $("#qoList").innerHTML = qoList(); }
  });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p") { e.preventDefault(); S.qo = true; renderQo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b" && S.sk === "3") { e.preventDefault(); S.nav3 = !S.nav3; render(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); const b = $(".savebtn"); if (b) b.click(); }
    if (e.key === "Escape" && S.qo) { S.qo = false; renderQo(); }
    if (e.key === "Enter" && S.qo) { const hot = $(".qo__item"); if (hot) hot.click(); }
  });
  window.addEventListener("resize", () => { const was = S.det; if (false && was && S.sk === "1" && !render.userDet) { /* mantém escolha */ } });

  $("#skHide").addEventListener("click", () => { const bar = $(".skbar"); const mini = bar.classList.toggle("is-mini"); $("#skHide").textContent = mini ? "Mostrar a explicação" : "Esconder a explicação"; $("#skHide").setAttribute("aria-expanded", String(!mini)); });
  hydrate(document);
  let first = "1";
  try { first = localStorage.getItem("skcfg") || "1"; } catch (e) { first = "1"; }
  const hm = (location.hash || "").match(/#sk(\d)/); const h = hm ? hm[1] : "";
  if (SK[h]) first = h;
  // Ganchos de captura: #sk1-pack, #sk2-open, #sk3-form etc. (só para as capturas de verificação)
  const extra = (location.hash.split("-")[1] || "");
  show(SK[first] ? first : "1");
  if (extra === "pack") { S.origin = "pack"; render(); }
  if (extra === "open") { S.open2 = true; render(); }
  if (extra === "form") { S.cmp = false; render(); }
  if (extra === "nav") { S.nav3 = true; render(); }
  if (extra === "text") { S.mode = "text"; render(); }
  if (extra === "q") { S.q = "distan"; render(); }
  if (extra === "own") { S.file = "options.txt"; if (S.sk === "2") S.open2 = true; S.cmp = false; render(); }
  if (extra === "js") { S.file = "kubejs/server_scripts/receitas.js"; S.cmp = false; if (S.sk === "2") S.open2 = true; render(); }
  if (extra === "ini") { S.file = "config/jei/jei-client.ini"; if (S.sk === "2") S.open2 = true; render(); }
  if (extra === "gen") { S.file = "config/create-client.toml"; S.cmp = false; if (S.sk === "2") S.open2 = true; render(); }
  if (extra === "qo") { S.qo = true; renderQo(); }
})();

/* Encaixe da janela do app no espaço disponível */
(function () {
  const D = 1280;
  const win = document.getElementById("win");
  if (!win) return;
  const fit = document.createElement("div");
  fit.className = "fit";
  win.parentNode.insertBefore(fit, win);
  fit.appendChild(win);
  function layout() {
    const w = fit.clientWidth, h = fit.clientHeight;
    const s = w < D ? w / D : 1;
    win.style.width = w / s + "px";
    win.style.height = h / s + "px";
    win.style.transform = s < 1 ? "scale(" + s + ")" : "";
  }
  layout();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(fit); else window.addEventListener("resize", layout);
})();
(function () {
  const b = document.getElementById("skHide");
  const bar = document.querySelector(".skbar");
  if (b && bar && !bar.classList.contains("is-mini")) b.click();
})();

</script>
